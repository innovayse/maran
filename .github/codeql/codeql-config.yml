# CodeQL configuration for .github/workflows/codeql.yml.
#
# Generated code is never edited (rules/proto.md), so a finding in it can only be dismissed, never
# fixed. Everything the build writes under an `obj/` directory is generated: the protobuf and gRPC
# sources of Maran.Agent.Client and the RegexGenerator output of the projects that use it. Scanning
# it only adds alerts nobody can act on.
name: Maran CodeQL configuration

paths-ignore:
  - '**/obj/**'
