name: frontend

on:
  push:
    paths:
      - 'frontend/**'
      # The verdict harness and the committed baseline are part of this lane now: an edit to
      # either changes what this job asserts, so it has to run when they move. Without this path
      # a change to `scripts/lib/suite.sh` or to `scripts/test-baseline.txt` would alter the SPA
      # floor with no SPA job ever running — which is the same shape as having no floor.
      - 'scripts/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/frontend.yml'

defaults:
  run:
    working-directory: frontend

# One run per pull request: a new push to the same PR cancels the run it supersedes. Pushes to
# dev and main are never cancelled, and never even queued behind each other — their group carries
# the run id, so each push is alone in its own group (a shared group would let GitHub drop a
# PENDING push run when a newer one queues, even with cancel-in-progress false).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    # Measured basis: the gates only since issue #289 moved the Playwright suite to `shard`. Before
    # that the one job took 10.7-12.6 min on successful dev runs 41293966857, 41279955166 and
    # 41242417734, of which the suite was about 8 min and the rest (install, lint, typecheck, build)
    # about 4-5 min. 15 is those gates with generous headroom; it has NO measurement of its own yet
    # and is to be re-sized from the first runs of this layout (rules/testing.md: a limit names the
    # runs it was sized from).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Node 24, and deliberately NOT pinned to an exact patch the way `backend.yml` pins the .NET
      # SDK. The reason the SDK is pinned there is that the committed baseline is a count taken on
      # one compiler, and a different compiler is a different suite. Here the component that decides
      # what gets collected is `@playwright/test`, and that is already pinned to an exact version by
      # `frontend/package-lock.json` and installed by `npm ci` below — the runtime's patch level does
      # not decide which spec files `testMatch` finds. The versions actually used are printed by the
      # step below, so the log records them either way.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # For the record, in the log, before anything is measured: which node and which Playwright
      # this run used. This is not a gate — it makes no assertion and claims none. It exists because
      # when the collected total moves, the first question is whether the runner moved under it, and
      # nothing in this repository would otherwise be able to answer that after the fact.
      - name: Record the runner's versions
        run: |
          echo "node:       $(node --version)"
          echo "npm:        $(npm --version)"
          echo "playwright: $(npx playwright --version)"

      # These three stay exactly as they were, and that is a decision rather than an omission.
      # They are a DIFFERENT gate from counting tests: `lint` (oxlint + eslint + the locale-key and
      # page-route checks), `typecheck` (vue-tsc) and `build` assert that the SPA is well-formed,
      # and none of them can observe whether a spec file stopped being collected. The reverse is
      # true too — the Playwright suite runs against `preview`, so a type error that vue-tsc would
      # catch reaches the suite only if it also breaks the build the webServer performs. The backend
      # lane kept its Release build beside the verdict step for the same reason. They also fail
      # faster and with a far more specific message than a suite that collapses downstream.
      # `npm run lint` now prints its own collected verdict — `LINT VERDICT: OK|FAIL —
      # N checks declared, N run, N passed, N failed` — because its four sub-checks used to
      # be chained with `&&`, so the first failure silenced the rest and an engineer reading
      # a red lane could not tell that a whole gate had been skipped. Gate on the line, and
      # fail when the line and the exit status disagree: that is the same shape the backend
      # and agent lanes use, and it is the last exit-code-only gate in this workflow.
      - name: Lint, gated on the printed verdict
        id: lint
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/verdict"
          status=0
          npm run lint 2>&1 | tee "$RUNNER_TEMP/verdict/lint.log" || status=$?
          echo "lint exit status: $status (recorded; the verdict is the line below, not this)"
          if ! grep -q '^LINT VERDICT: OK' "$RUNNER_TEMP/verdict/lint.log"; then
            echo "::error::the SPA lint gate did not print 'LINT VERDICT: OK'. This step passes"
            echo "on the printed verdict, never on an exit code, and no verdict was printed."
            if ! grep -aE '^(LINT VERDICT|lint: |check-locale-keys|check-page-routes)' \
              "$RUNNER_TEMP/verdict/lint.log"; then
              echo "(no verdict-shaped line in the log; its last 40 lines follow)"
              tail -40 "$RUNNER_TEMP/verdict/lint.log" || echo "(the log is empty or absent)"
            fi
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::the SPA lint gate printed 'LINT VERDICT: OK' and then exited $status."
            echo "Those two disagree, so neither is evidence: score nothing from this run."
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run build

      # The sharded lane's own selftest: the combine step planted with every way a shard set can
      # lie (a shard that vanished, a spec file in two shards or in none, a file without a row, a
      # dropped total, a baselined file gone), plus the real enumeration and a partition with no
      # empty shard. It sits here because it needs the installed `@playwright/test` to list the real
      # spec files and nothing else: no browser, no server.
      - name: Shard combine selftest
        working-directory: ${{ github.workspace }}
        run: |
          set -o pipefail
          bash scripts/maran test spa --shards-selftest 2>&1 | tee "$RUNNER_TEMP/shards-selftest.log"
          grep -q '^SPA SHARDS SELFTEST: OK' "$RUNNER_TEMP/shards-selftest.log" || {
            echo "::error::the SPA shard selftest did not print 'SPA SHARDS SELFTEST: OK'."
            exit 1
          }

  # THE PLAYWRIGHT SUITE IN THREE SHARDS (issue #289). The one job used to run every spec file
  # after the gates, `workers: 1`, and the suite step alone was 12.8 of 16.4 minutes. Each shard
  # installs its own browser (about a minute, uncached on purpose, see below) and runs a third of the
  # spec files: `maran test spa --shard i/3` (scripts/lib/spa-shards.sh) packs them
  # deterministically by the test counts of the committed baseline. Three shards put the per-shard
  # tests near four minutes, which is where one more shard would cost its own install again. A shard
  # prints no verdict: only `verdict` below, which proves the partition and scores the sum against
  # the baseline, does.
  shard:
    runs-on: ubuntu-latest
    # No measurement of this layout yet: the basis is the old job (suite step 12.8 min for the whole
    # suite, install 1-10 min, issue #409), so a third of the suite plus the slowest measured
    # install plus build is under 25. To be re-sized from the first runs (rules/testing.md).
    timeout-minutes: 25
    strategy:
      # Every shard reports, always: a verdict missing a shard is a verdict over part of the suite.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Playwright needs a real browser, and the harness's toolchain check REFUSES to measure
      # without one (it probes `$PLAYWRIGHT_BROWSERS_PATH` or `~/.cache/ms-playwright` for a
      # `chromium-*` directory). Kept exactly as it was found: `--with-deps` also installs the
      # system libraries chromium links against, which a bare runner does not have.
      #
      # NOT cached, and left that way on purpose rather than by oversight. A browser cache keyed on
      # anything but the exact Playwright version can serve a chromium build that does not match the
      # runner — and the failure that produces is the silent kind: the browser is present, so the
      # harness's directory probe passes, the browser then fails to launch, and the suite collects
      # nothing. That IS caught downstream (the parse yields no row and the harness reports ABORTED,
      # never a pass), but trading a slow, correct install for a fast one that needs a downstream
      # net to catch it is not a trade worth making here. `chromium` alone is the only project in
      # `playwright.config.ts`, so this is already the small install, not the three-browser one.
      - name: Install the Playwright browser
        # Its own limit: the install is the step that varies most between runners (9-10 min on a
        # slow one, issue #409), so a wedged download fails at 20 minutes under this step's name and
        # not as the whole job's cancellation.
        timeout-minutes: 20
        run: npx playwright install --with-deps chromium

      # WHY THE SUITE IS NOT `npm run test:e2e`. It used to be, and that is the gap
      # rules/testing.md named by file: "`.github/workflows/frontend.yml` still runs bare
      # `npm run test:e2e`, so in CI the SPA floor is compared against nothing, exactly as the
      # backend and agent lanes were."
      #
      # What the bare command cannot see — and every one of these leaves it exiting 0:
      #   - a spec file that stops being COLLECTED. A rename, a bad import that Playwright reports
      #     as a load error, a `testMatch` that no longer matches: the file simply disappears from
      #     the run. `npm run test:e2e` then passes over a smaller suite and says nothing.
      #   - a collected total that fell while the file list held steady — a `describe` block deleted,
      #     a test commented out.
      #   - a total that held steady because another file grew by as much as this one shrank. This
      #     is why the baseline is keyed ONE ROW PER SPEC FILE rather than on the grand
      #     total: a per-file floor names the file that moved, a total floor cannot.
      #   - a FLAKY test. `playwright.config.ts` sets `retries: 1` under CI, so a test that fails and
      #     then passes leaves the process green. rules/testing.md: "a flaky test is a P1 bug: fix or
      #     delete-and-file, never retry-loop it." The harness scores `flaky` as a FAILURE and names
      #     it as such.
      #
      # `maran test spa` itself still runs the WHOLE suite and refuses every narrowing flag. A shard
      # narrows the run only through `--shard`, and the `verdict` job refuses to score anything the
      # partition proof has not shown to be the whole suite, each spec file exactly once. Each shard
      # scores from Playwright's JSON reporter rather
      # than the `list` reporter (the list reporter prints one line per ATTEMPT, so under `retries: 1`
      # a text parser would report a total no run produced), parses one row per spec file, names
      # every failing test, reconciles the named list against the totals, and compares both against
      # `scripts/test-baseline.txt`. A baselined spec file absent from the run is named as VANISHED
      # and fails the lane; a collected total below the baseline fails; a run with no machine-readable
      # result at all is ABORTED rather than passed, because "no tests found" is a failure. A
      # collection error surfaces as its own `<collection>` row carrying the module or file that
      # would not load. It self-tests its own parsers against planted fixtures before it measures
      # anything.
      #
      # PORTS. `playwright.config.ts` binds 5173 with `reuseExistingServer: false` and `--strictPort`,
      # which locally has already produced a run that exited 0 having executed nothing, because a
      # dev server held the port. That cannot happen here for two independent reasons, and the second
      # is the one being relied on: (1) a GitHub-hosted runner is a fresh VM with nothing bound;
      # (2) the harness does not use the config's default at all — `suite_run` asks the KERNEL for a
      # free port (bind 0, read back the assignment), exports it as `E2E_PORT`, and prints it into
      # the log. So `E2E_PORT` is deliberately NOT set here: setting it would replace a measured free
      # port with a guessed one. And if the port were taken in the race between the probe and the
      # webServer binding it, `--strictPort` makes the server fail loudly, the suite collects
      # nothing, and the harness reports ABORTED — the failure is loud in either direction.
      #
      # `working-directory` is overridden to the repository root — the job's default is `frontend`,
      # and the harness locates the tree from its own path and runs the SPA suite itself.
      #
      # `CI: 'true'` is kept explicitly even though GitHub sets it: `playwright.config.ts` reads it
      # to turn on `forbidOnly`, `retries: 1` and `workers: 1`, and this lane should not depend on an
      # implicit runner variable for a setting that changes what the suite asserts.
      #
      # `--accept` is NEVER passed: that flag RECORDS the baseline, and a check that refreshes its
      # own baseline enforces nothing.
      #
      # The pass condition is the harness's printed VERDICT LINE, not its exit status. A non-zero
      # status fails the step, and so does a status of 0 with no `TEST VERDICT: OK` printed — which
      # is the shape every measured false pass in this repository has had. `set -o pipefail` because
      # `... | tee` otherwise reports TEE's status, which is 0 whatever the command did. In a shard
      # the line is `SHARD i/3: ran`; the `TEST VERDICT: OK` line is the `verdict` job's.
      - name: Shard ${{ matrix.shard }} of 3 — a third of the spec files
        working-directory: ${{ github.workspace }}
        id: shard
        env:
          CI: 'true'
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/shards"
          status=0
          bash scripts/maran test spa --shard ${{ matrix.shard }}/3 --out "$RUNNER_TEMP/shards" 2>&1 |
            tee "$RUNNER_TEMP/shard.log" || status=$?
          echo "harness exit status: $status (recorded; the line below is the evidence, not this)"
          if ! grep -q '^SHARD ${{ matrix.shard }}/3: ran' "$RUNNER_TEMP/shard.log"; then
            echo "::error::shard ${{ matrix.shard }}/3 did not print 'SHARD ${{ matrix.shard }}/3: ran'. It passes on"
            echo "that line, never on an exit code; no such line was printed."
            echo "--- what the shard reported ---"
            if ! grep -aE '^(SHARD|ABORTED|REFUSED|CONTAMINATED|UNRECONCILED|SELF-TEST|TEST VERDICT)' \
              "$RUNNER_TEMP/shard.log"; then
              echo "(no verdict-shaped line in the log; its last 40 lines follow)"
              tail -40 "$RUNNER_TEMP/shard.log" || true
            fi
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::shard ${{ matrix.shard }}/3 printed 'ran' and then exited $status."
            echo "Those two disagree, so neither is evidence: score nothing from this run."
            exit 1
          fi

      # The shard's result files, always — including on a red run. The `verdict` job reads these,
      # and a shard that never uploads is named MISSING there instead of silently absent. Conditioned
      # on the shard step having RUN, so a gate above it that failed does not add a second red.
      - name: Keep the shard's result
        if: ${{ !cancelled() && steps.shard.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shards/
          if-no-files-found: error

  # The verdict over the merged shard results: every shard present and ran, one enumeration, file
  # lists disjoint and covering it, a row for every file; then the summed rows against the
  # per-spec-file baseline in scripts/test-baseline.txt, so a vanished spec file, a dropped total or
  # a flaky test fails exactly as it does in an unsharded run. `always()` so that a red or missing
  # shard still gets named here; needs no node, no browser and no build.
  verdict:
    if: ${{ always() }}
    needs: shard
    runs-on: ubuntu-latest
    # No measurement yet: reading a few result files and comparing rows takes seconds; 10 is a hang
    # guard to be re-sized from the first runs.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: frontend-shard-*
          path: ${{ runner.temp }}/artifacts

      # `working-directory` is overridden to the repository root for the same reason as in the shard
      # step: the workflow default is `frontend`, and `scripts/maran` lives at the root.
      - name: Test verdict — the shards combined against the committed baseline
        working-directory: ${{ github.workspace }}
        env:
          CI: 'true'
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/shards"
          find "$RUNNER_TEMP/artifacts" -name 'shard-*' -type f -exec cp {} "$RUNNER_TEMP/shards/" \;
          status=0
          bash scripts/maran test spa --combine "$RUNNER_TEMP/shards" 2>&1 |
            tee "$RUNNER_TEMP/verdict.log" || status=$?
          echo "harness exit status: $status (recorded; the verdict is the line above, not this)"
          if ! grep -q '^TEST VERDICT: OK' "$RUNNER_TEMP/verdict.log"; then
            echo "::error::the combined SPA suite did not print 'TEST VERDICT: OK'. This lane passes on"
            echo "the harness's verdict, never on an exit code, and no verdict was printed."
            echo "--- what the run reported ---"
            if ! grep -aE '^(TEST VERDICT|collected |ABORTED|REFUSED|SELF-TEST|PARTITION|partition| +spa: )' \
              "$RUNNER_TEMP/verdict.log"; then
              echo "(no verdict, finding or abort line in the log at all — its last 40 lines:)"
              tail -40 "$RUNNER_TEMP/verdict.log" || true
            fi
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::the combine printed 'TEST VERDICT: OK' and then exited $status."
            echo "Those two disagree, so neither is evidence: score nothing from this run."
            exit 1
          fi

      - name: Keep the verdict log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-verdict
          path: ${{ runner.temp }}/verdict.log
          if-no-files-found: error
