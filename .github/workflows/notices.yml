name: notices

# THIRD-PARTY-NOTICES.md is generated from all three ecosystems, so this job needs all three
# toolchains — it does not belong in the backend job, which has only the .NET SDK and would
# fail on a missing cargo rather than on stale notices.
on:
  push:
    branches: [main, dev]
    paths:
      - 'agent/Cargo.lock'
      - 'backend/Directory.Packages.props'
      - 'frontend/package-lock.json'
      - 'THIRD-PARTY-NOTICES.md'
      - 'scripts/**'
      - '.github/workflows/notices.yml'
  pull_request:
    paths:
      - 'agent/Cargo.lock'
      - 'backend/Directory.Packages.props'
      - 'frontend/package-lock.json'
      - 'THIRD-PARTY-NOTICES.md'
      - 'scripts/**'
      - '.github/workflows/notices.yml'

permissions:
  contents: read

# One run per pull request: a new push to the same PR cancels the run it supersedes. Pushes to
# dev and main are never cancelled, and never even queued behind each other — their group carries
# the run id, so each push is alone in its own group (a shared group would let GitHub drop a
# PENDING push run when a newer one queues, even with cancel-in-progress false).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  current:
    runs-on: ubuntu-latest
    # Measured basis: successful dev runs 41293966828, 41279955197, 41242417666 took 1.6, 2.1 and
    # 1.2 min. 10 covers cold caches for all three ecosystems.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.317'

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # The licences are read from what is actually resolved, so the packages have to be there:
      # cargo's metadata needs the registry, and the npm walk needs node_modules.
      - name: Restore dependencies
        run: |
          dotnet restore backend/Maran.sln
          (cd agent && cargo fetch)
          (cd frontend && npm ci)

      - name: Notices match the dependencies
        run: bash scripts/maran licenses --check
