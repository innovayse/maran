name: codeql

# Static analysis for the two ecosystems CodeQL understands here. Rust is not covered — its
# equivalent is `cargo clippy -D warnings` plus the rule that `unsafe` exists in exactly one
# module, which the agent workflow and `maran structure` enforce.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly, because a query that finds nothing today can find something after the query pack
    # is updated, with no change of ours at all.
    - cron: '17 4 * * 1'

permissions:
  contents: read
  security-events: write

# One run per pull request: a new push to the same PR cancels the run it supersedes. Pushes to
# dev and main are never cancelled, and never even queued behind each other — their group carries
# the run id, so each push is alone in its own group (a shared group would let GitHub drop a
# PENDING push run when a newer one queues, even with cancel-in-progress false).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Measured basis: successful dev runs 41293966837, 41285233247, 41279955436 took 5.5-9.5 min
    # (csharp) and 1.2-1.6 min (javascript-typescript). 25 is the slowest leg plus ~150% headroom,
    # because the query pack changes under it with no change of ours.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        if: matrix.language == 'csharp'
        with:
          dotnet-version: '9.0.317'

      - name: Install protoc
        if: matrix.language == 'csharp'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Build the backend
        if: matrix.language == 'csharp'
        run: dotnet build backend --configuration Release

      - uses: github/codeql-action/autobuild@v4
        if: matrix.language != 'csharp'

      # The upload is switched off here because CodeQL does not apply `paths-ignore` to a compiled
      # language: the protobuf, gRPC and RegexGenerator sources the build writes under `obj/` are
      # analysed whatever a configuration file says (issue #523). The results are filtered below
      # and uploaded by the next step.
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: sarif-results

      # The filter proves itself first (a generated path is dropped, a lookalike is kept), then
      # rewrites every SARIF file; both print a verdict line and the run is scored on it, never
      # on an exit status alone. No SARIF file at all is `DID NOT RUN` and fails the job.
      - name: Drop results in generated code
        run: |
          set -o pipefail
          for mode in selftest "filter sarif-results"; do
            log="$RUNNER_TEMP/codeql-filter.log"
            status=0
            bash scripts/maran codeql $mode 2>&1 | tee "$log" || status=$?
            if ! grep -qa '^CODEQL-SARIF VERDICT: OK' "$log"; then
              echo "::error::codeql $mode did not print 'CODEQL-SARIF VERDICT: OK' (status ${status})."
              exit 1
            fi
          done

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-results
          category: /language:${{ matrix.language }}
