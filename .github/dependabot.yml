# Dependency updates for all four ecosystems this repository builds from. Without this, a
# vulnerable transitive dependency is found by whoever reads the advisory feed — which is to
# say, by nobody.
#
# Grouped and weekly rather than one pull request per bump: a panel that runs as root wants its
# updates reviewed, and forty separate pull requests get reviewed by being ignored.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend:
        patterns: ['*']
    commit-message:
      prefix: chore(backend)

  - package-ecosystem: cargo
    directory: /agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      agent:
        patterns: ['*']
    commit-message:
      prefix: chore(agent)

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ['*']
    commit-message:
      prefix: chore(frontend)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore(ci)
