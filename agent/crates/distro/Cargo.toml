# Distro adapters: the DistroAdapter trait plus one implementation folder per
# family (debian/, rhel/). The only crate allowed to branch on distro specifics.

[package]
name = "maran-distro"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# maran-agent-core: php_fpm_binary takes the validated PhpVersion, so the one path
# built with format! is exactly as closed as that grammar. agent-core depends on
# no maran-* crate, so this edge creates no cycle.
maran-agent-core = { path = "../agent-core" }
# thiserror: detection refuses unsupported hosts with a typed error, never a panic.
thiserror.workspace = true

[lints]
workspace = true
