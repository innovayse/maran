# SYNTHETIC FIXTURE: hand-written text, not captured from a real host.
<VirtualHost *:80>
    ServerName www.shopsite.example.org:80
    ServerAlias shopsite.example.org \
                shop.shopsite.example.org
    DocumentRoot "/home/shopsite/public_html"
    <Directory "/home/shopsite/public_html">
        Require all granted
    </Directory>
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.1-fpm.sock|fcgi://localhost"
    </FilesMatch>
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName api.acme.example.com
    DocumentRoot /home/acme/api
    ProxyPass / http://127.0.0.1:8080/
</VirtualHost>
</IfModule>

<VirtualHost *:80>
    servername plain.acme.example.com
    documentroot /home/acme/plain
</VirtualHost>

<VirtualHost *:80>
    ServerName outside.example.net
    DocumentRoot /var/www/html
</VirtualHost>
