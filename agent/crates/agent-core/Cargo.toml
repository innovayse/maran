# Core primitives: input validation (account names, path containment) and the
# workspace's ONLY home of unsafe syscall/setuid wrappers (src/privs/).

[package]
name = "maran-agent-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# thiserror: typed errors instead of panics — the agent runs as root.
thiserror.workspace = true
# libc: raw syscall bindings for src/privs/ — fork, setgroups/setgid/setuid,
# getpwnam_r, waitpid, _exit. Raw on purpose; see the workspace manifest.
libc.workspace = true
# rustix: safe bindings for the syscalls that are NOT privilege changes — statvfs
# in utils/available_bytes. Safe wrappers on purpose: the crate's unsafe budget is
# spent in src/privs/ and nowhere else (rules/rust.md "unsafe").
rustix.workspace = true
# base64: decoding an SSH public key in validation/system/ssh_public_key.rs, so a
# key is proven to be a key before root writes it (issue #135).
base64.workspace = true
# sha2 and subtle: the SHA-256 fingerprint of a fleet certificate and its constant-time
# comparison, in validation/fleet/certificate_fingerprint.rs (issue #180).
sha2.workspace = true
subtle.workspace = true

# tokio (`sync` only, no runtime): the counting semaphores behind
# utils/bounded_slots, which bounds how many operations of one kind run at once.
# Shared by two ops areas, so it lives here and not in either (rules/rust.md).
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
# tempfile: path containment is only meaningfully tested against a real filesystem.
tempfile.workspace = true
# proptest: the property tests of the validation types (src/tests/validation/**/*_property_tests.rs).
proptest.workspace = true

[lints]
workspace = true
