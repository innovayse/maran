; Rendered by Maran. Do not edit: this file is replaced whenever the plan changes.
[acme-8.3]
user = acme
group = acme

listen = /run/maran/php/acme-8.3.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
; The limit that actually reclaims a stuck worker. max_execution_time does not
; count time spent in a blocking syscall, so a request waiting on a dead
; database is not counted at all and holds its worker forever; php-fpm's own
; timer does not care what the request is doing. Set here, where a customer
; cannot reach it, and from the same budget max_execution_time is bounded by.
request_terminate_timeout = 300s

; The account can read its own home and nothing else. open_basedir is not a
; security boundary on its own — the uid is — but it turns a mistake in one
; site into an error instead of a read of a neighbour's file.
;
; /tmp is deliberately NOT granted. It is shared and world-readable, and PHP's
; default session handler falls back to it when the packaged session directory
; is not writable by the account — which it is not, being root-owned. That
; fallback would put one customer's sess_* files where every other customer's
; PHP could enumerate and read them, which is session-token theft across
; tenants from inside the pool whose purpose is to prevent it. The two
; directories below replace it; both are inside the home and are named anyway,
; so this line reads as the complete list of what the pool may touch.
php_admin_value[open_basedir] = /home/acme:/home/acme/.maran/sessions:/home/acme/.maran/tmp
; Sessions and in-flight uploads go to the account's own directories, owned by
; the account and readable by nobody else. Set admin-side so a php_value cannot
; move either of them back to a shared location.
php_admin_value[session.save_path] = /home/acme/.maran/sessions
php_admin_value[upload_tmp_dir] = /home/acme/.maran/tmp
; Defence in depth, NOT the boundary. The boundary is the uid: this pool runs
; as the account, so everything below stays inside what that account could
; already reach. What the list buys is that the easy escalations — a dropped
; webshell, a vulnerable plugin's one-liner — fail instead of working.
;
; putenv, dl and pcntl_exec are on it because leaving them off makes the rest
; decorative: putenv("LD_PRELOAD=/home/acme/x.so") followed by any function
; that spawns a process is the published bypass of exactly this kind of list.
; mail is deliberately LEFT ENABLED — it spawns sendmail, but disabling it
; breaks ordinary sites and the panel offers no SMTP alternative yet.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,putenv,pcntl_exec,pcntl_fork,dl,proc_nice,proc_terminate
php_admin_flag[allow_url_fopen] = off
; Set admin-side, not by the nginx try_files guard alone: with the PHP default
; of cgi.fix_pathinfo=1, a request for /uploads/evil.jpg/x.php would still
; reach php-fpm, which would walk back up the path looking for a file it can
; execute and run the uploaded image as PHP. php_admin_value means the
; whitelisted overrides below cannot turn this back on.
php_admin_value[cgi.fix_pathinfo] = 0

php_value[upload_max_filesize] = 32M
