# Rendered by Maran. Do not edit: this file is replaced whenever the site changes.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # The ACME challenge is served over plain HTTP before a certificate exists,
    # so this location stays reachable even when everything else redirects.
    location ^~ /.well-known/acme-challenge/ {
        root /home/acme/sites/example.com;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.com www.example.com;

    ssl_certificate /etc/maran/certs/example.com/fullchain.pem;
    ssl_certificate_key /etc/maran/certs/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /home/acme/logs/example.com.access.log;
    error_log /home/acme/logs/example.com.error.log;

    root /home/acme/sites/example.com;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Refuses PATH_INFO requests like /uploads/evil.jpg/x.php before
        # fastcgi_pass is reached: with cgi.fix_pathinfo left at its PHP
        # default, php-fpm would otherwise walk back up the path looking for
        # something it can execute and run the uploaded file as PHP. The pool
        # also sets cgi.fix_pathinfo=0 itself — this line and that setting are
        # two independent stops on the same hole, not one relying on the other.
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:/run/maran/php/acme-8.3.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    # Everything under a dot is denied, including .env, .git and the challenge
    # directory's neighbours. The ACME location above is matched first by ^~.
    location ~ /\. {
        deny all;
    }
}
