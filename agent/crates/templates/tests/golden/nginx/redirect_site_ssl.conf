server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # The ACME challenge of a redirected name is answered here, not redirected.
    location ^~ /.well-known/acme-challenge/ {
        root /home/acme/sites/example.com;
        # A link is followed only when it and its target share an owner
        # (see SiteBody).
        disable_symlinks if_not_owner;
        default_type "text/plain";
    }

    location / {
        return 301 https://www.example.com$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.com;

    ssl_certificate /etc/maran/certs/example.com/fullchain.pem;
    ssl_certificate_key /etc/maran/certs/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        return 301 https://www.example.com$request_uri;
    }
}
