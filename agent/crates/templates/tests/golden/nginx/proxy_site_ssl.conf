# Rendered by Maran. Do not edit: this file is replaced whenever the site changes.
server {
    listen 80;
    listen [::]:80;
    server_name app.example;

    # The ACME challenge is served over plain HTTP before a certificate exists,
    # so this location stays reachable even when everything else redirects.
    location ^~ /.well-known/acme-challenge/ {
        root /home/acme/sites/app.example;
        # A link is followed only when it and its target share an owner
        # (see SiteBody).
        disable_symlinks if_not_owner;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.example;

    ssl_certificate /etc/maran/certs/app.example/fullchain.pem;
    ssl_certificate_key /etc/maran/certs/app.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/maran/sites/acme/app.example.access.log;
    error_log /var/log/maran/sites/acme/app.example.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
