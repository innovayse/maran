# Rendered by Maran. Do not edit: this file is replaced whenever the site changes.
server {
    listen 80;
    listen [::]:80;
    server_name static.example www.static.example;

    # The ACME challenge is served over plain HTTP before a certificate exists,
    # so this location stays reachable even when everything else redirects.
    location ^~ /.well-known/acme-challenge/ {
        root /home/acme/sites/static.example;
        # A link is followed only when it and its target share an owner
        # (see SiteBody).
        disable_symlinks if_not_owner;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name static.example www.static.example;

    ssl_certificate /etc/maran/certs/static.example/fullchain.pem;
    ssl_certificate_key /etc/maran/certs/static.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/maran/sites/acme/static.example.access.log;
    error_log /var/log/maran/sites/acme/static.example.error.log;

    root /home/acme/sites/static.example;
    index index.html index.htm;

    # A link is followed only when it and its target share an owner; no from= on purpose.
    disable_symlinks if_not_owner;

    location / {
        try_files $uri $uri/ =404;
    }

    # Everything under a dot is denied, including .env, .git and the challenge
    # directory's neighbours. The ACME location above is matched first by ^~.
    location ~ /\. {
        deny all;
    }
}
