# Rendered by Maran. Do not edit: this file is replaced whenever the site changes.
limit_req_zone $binary_remote_addr zone=rl_app.example:1m rate=100r/s;
server {
    listen 80;
    listen [::]:80;
    server_name app.example;

    # The ACME challenge is served over plain HTTP before a certificate exists,
    # so this location stays reachable even when everything else redirects.
    location ^~ /.well-known/acme-challenge/ {
        root /home/acme/sites/app.example;
        # A link is followed only when it and its target share an owner
        # (see SiteBody).
        disable_symlinks if_not_owner;
        default_type "text/plain";
    }

    access_log /var/log/maran/sites/acme/app.example.access.log;
    error_log /var/log/maran/sites/acme/app.example.error.log;

    client_max_body_size 512m;

    limit_req zone=rl_app.example burst=200 nodelay;
    limit_req_status 429;
    limit_req_log_level warn;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
