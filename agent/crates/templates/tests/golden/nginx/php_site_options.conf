# Rendered by Maran. Do not edit: this file is replaced whenever the site changes.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # The ACME challenge is served over plain HTTP before a certificate exists,
    # so this location stays reachable even when everything else redirects.
    location ^~ /.well-known/acme-challenge/ {
        root /home/acme/sites/example.com;
        # A link is followed only when it and its target share an owner
        # (see SiteBody).
        disable_symlinks if_not_owner;
        default_type "text/plain";
        # A site-wide password or address list must not reach the certificate
        # authority: this location answers everyone.
        auth_basic off;
        allow all;
    }

    access_log /var/log/maran/sites/acme/example.com.access.log;
    error_log /var/log/maran/sites/acme/example.com.error.log;

    client_max_body_size 100m;

    root /home/acme/sites/example.com;
    index index.php index.html;

    # A link is followed only when it and its target share an owner; no from= on purpose.
    disable_symlinks if_not_owner;

    auth_basic "Restricted";
    auth_basic_user_file /etc/maran/nginx/auth/example.com.htpasswd;
    allow 203.0.113.0/24;
    allow 2001:db8::/32;
    deny all;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Refuses PATH_INFO requests like /uploads/evil.jpg/x.php before
        # fastcgi_pass is reached: with cgi.fix_pathinfo left at its PHP
        # default, php-fpm would otherwise walk back up the path looking for
        # something it can execute and run the uploaded file as PHP. The pool
        # also sets cgi.fix_pathinfo=0 itself — this line and that setting are
        # two independent stops on the same hole, not one relying on the other.
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:/run/maran-php/acme-8.3.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    # Everything under a dot is denied, including .env, .git and the challenge
    # directory's neighbours. The ACME location above is matched first by ^~.
    location ~ /\. {
        deny all;
    }

    location = /old {
        return 301 /new;
    }

    location ^~ /blog/ {
        rewrite ^/blog/(.*)$ https://blog.example.org/$1 redirect;
    }

    location ~* \.(css|js|mjs|map|png|jpg|jpeg|gif|webp|avif|svg|ico|woff|woff2|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri /index.php?$query_string;
    }
}
