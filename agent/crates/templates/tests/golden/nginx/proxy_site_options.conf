# Rendered by Maran. Do not edit: this file is replaced whenever the site changes.
server {
    listen 80;
    listen [::]:80;
    server_name app.example;

    # The ACME challenge is served over plain HTTP before a certificate exists,
    # so this location stays reachable even when everything else redirects.
    location ^~ /.well-known/acme-challenge/ {
        root /home/acme/sites/app.example;
        # A link is followed only when it and its target share an owner
        # (see SiteBody).
        disable_symlinks if_not_owner;
        default_type "text/plain";
        # A site-wide password or address list must not reach the certificate
        # authority: this location answers everyone.
        auth_basic off;
        allow all;
    }

    access_log /var/log/maran/sites/acme/app.example.access.log;
    error_log /var/log/maran/sites/acme/app.example.error.log;

    client_max_body_size 5m;

    auth_basic "Restricted";
    auth_basic_user_file /etc/maran/nginx/auth/app.example.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /status {
        return 302 /maintenance;
    }
}
