# Rendered by Maran. Do not edit: this file is replaced whenever the site changes.
<VirtualHost *:80>
    ServerName example.com
    ServerAlias www.example.com

    # The ACME challenge is served over plain HTTP before a certificate exists,
    # so this location stays reachable even when everything else redirects.
    Alias /.well-known/acme-challenge/ /home/acme/sites/example.com/.well-known/acme-challenge/
    <Directory /home/acme/sites/example.com/.well-known/acme-challenge/>
        # A link is followed only when it and its target share an owner
        # (see SiteBody).
        Options -Indexes -FollowSymLinks +SymLinksIfOwnerMatch
        AllowOverride None
        ForceType text/plain
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>
<VirtualHost *:443>
    ServerName example.com
    ServerAlias www.example.com

    SSLEngine on
    SSLCertificateFile /etc/maran/certs/example.com/fullchain.pem
    SSLCertificateKeyFile /etc/maran/certs/example.com/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off

    CustomLog /var/log/maran/sites/acme/example.com.access.log combined
    ErrorLog /var/log/maran/sites/acme/example.com.error.log

    LimitRequestBody 536870912

    DocumentRoot /home/acme/sites/example.com
    DirectoryIndex index.php index.html

    <Directory /home/acme/sites/example.com>
        # A link is followed only when it and its target share an owner.
        Options -Indexes -FollowSymLinks +SymLinksIfOwnerMatch
        AllowOverride None
        FallbackResource /index.php
        Require all granted
    </Directory>

    # Only a file whose name ends in .php is handed to the pool. A request such as
    # /uploads/evil.jpg/x.php resolves to the .jpg and is served as a file, never run.
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/maran-php/acme-8.3.sock|fcgi://localhost"
    </FilesMatch>
    Header always unset X-Powered-By

    # Everything under a dot is denied, including .env and .git. The challenge directory
    # is exempt, as in the nginx vhost.
    <LocationMatch "^(?!/\.well-known/acme-challenge/).*/\.">
        Require all denied
    </LocationMatch>
</VirtualHost>
