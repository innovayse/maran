# Workspace manifest of maran-agent (rules/rust.md "Canonical agent layout").
# The clippy lints below are security controls, not taste: the agent runs as
# root, and a root process must return typed errors, never panic on input.

[workspace]
resolver = "3"
members = [
    "crates/agent",
    "crates/agent-core",
    "crates/distro",
    "crates/ops",
    "crates/templates",
]

[workspace.package]
version = "1.0.0-beta.4"
edition = "2024"
publish = false
license = "BUSL-1.1"

# Dependency versions live here so every crate in the workspace agrees on one.
[workspace.dependencies]
# The templates crate's render types derive `askama::Template`; the version is
# pinned here like every other workspace dependency.
askama = { version = "0.12", default-features = false }
# Held on the 0.13 line to match tonic: tonic 0.13.1 requires prost ^0.13, and
# the 0.14 line moved prost codec support out of tonic into a separate crate.
prost = "0.13.5"
# Safe wrappers over the syscalls that have no answer in `std`. Two callers, both
# of which must reach a syscall without writing `unsafe` of their own — `unsafe`
# in this workspace lives in agent-core::privs and nowhere else (rules/rust.md
# "unsafe"), and an #[allow] elsewhere would be that exception growing a second
# home. The polygon suites READ the credentials and ownership a root-only test has
# to observe (getuid, getgroups, fchown, kill); maran-ops' monitoring area asks
# statvfs how full the root filesystem is. Already in the lockfile as tempfile
# depends on it, so no new code enters the tree.
rustix = { version = "1.1.4", features = ["process", "thread", "fs"] }
# `nft -j` answers in JSON, and maran-ops reads the firewall's ban list out of
# it. A hand-rolled JSON parser in a root daemon is worse than a vetted one.
# Read as `Value` by the firewall area and through derive by the backup area.
serde_json = "1.0.151"
# SHA-256, and the ONE hash the backup area computes: a backup's integrity check
# is security-relevant, so rules/security.md item 9 rules out MD5/SHA1 and rules
# out writing the digest ourselves ("no home-grown crypto"). The alternatives
# were both worse: spawning `sha256sum` puts a process and a parser between the
# agent and a number it can compute, and it is one more binary the preflight has
# to prove exists before 03:00. RustCrypto's implementation, MIT/Apache-2.0,
# `Digest` only.
sha2 = "0.11.0"
# Generates a node's keypair and self-signed certificate (fleet mode, issue #180). A hand-written
# X.509 encoder in a root process would be worse than a vetted one, and rules/security.md item 9
# forbids home-grown crypto. rustls organisation, MIT OR Apache-2.0, no advisories on record.
# `default-features = false` drops `ring` (not compiled today; two providers would break rustls'
# default-provider selection) and `x509-parser` (the node never parses certificates with it);
# `aws_lc_rs` is the provider already in the build. Pinned exactly: its DEFAULTS are wrong for
# us (validity 1975-4096, one constant subject), so every field is set explicitly in
# `fleet/generate_node_identity.rs`. Brings `yasna`, `pem` and `time` with it.
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
# The calendar type rcgen takes a certificate's validity in (`not_before` / `not_after` are
# `time::OffsetDateTime`), so a caller cannot state a validity without naming it. Already
# compiled beneath rcgen; `std` only for the conversion from `SystemTime`.
time = { version = "0.3", default-features = false, features = ["std"] }
# Constant-time comparison of two certificate fingerprints (`CertificateFingerprint`), so the
# pin check does not answer faster the more leading bytes agree. Already in the lockfile
# beneath rustls; a direct dependency so the comparison is visible in this manifest.
subtle = "2.6.1"
# The cipher that seals a backup archive at rest (docs/backups/encryption.md,
# docs/superpowers/notes/2026-11-07-backup-encryption-threat-note.md): XChaCha20-Poly1305,
# RustCrypto, Apache-2.0 / MIT, one NCC Group audit. It is a dependency and not code of
# ours for the reason `sha2` and `object_store` are: rules/security.md item 9 forbids
# home-grown crypto, and spawning `gpg` instead would add a binary to the allow-list and a
# platform literal to both families. The 192-bit extended nonce is the reason for THIS
# AEAD over AES-GCM: every archive is sealed in many chunks under one long-lived key, so
# the nonce is a 128-bit random per-archive prefix plus a chunk counter, and a random
# prefix of that size never repeats across archives - a 96-bit GCM nonce would need a key
# derivation step (one more dependency) to be as safe. `alloc` for the `Aead` trait and
# nothing else: `default-features = false` drops the crate's own `getrandom` feature, the
# randomness being asked for once, below, where it is used.
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
# The per-archive random nonce prefix. Already in the lockfile beneath `tempfile` and
# `rand`; a direct dependency so the call that makes the one value on which sealing's
# safety rests is visible in this manifest and not inherited by accident.
getrandom = "0.4.3"
# The S3-compatible transport, and the ONE new dependency this plan adds. It is
# here rather than hand-written because SigV4 is signing, and rules/security.md
# item 9 forbids home-grown crypto outright — a request signer we wrote would be
# an HMAC-SHA256 canonicalisation nobody in this repository is qualified to
# review, failing closed only if we got every byte of the canonical request
# right. `aws` feature only: no Azure, no GCP, no generic HTTP store, and
# `default-features = false` drops the local-filesystem backend, which this
# product already has in `LocalObjectStoreHost` over `std::fs`. Apache-2.0 /
# MIT, and `maran licenses` covers whatever it drags in.
object_store = { version = "0.14.1", default-features = false, features = [
    "aws",
] }
# `derive` only, for the backup manifest. The manifest is a CONTRACT document —
# it is written by a creation and read back by a restore that refuses to proceed
# when the two disagree — and hand-written field-by-field JSON reading is exactly
# where a version field silently stops being checked. serde was already in the
# lockfile beneath `serde_json`; this makes it a direct dependency so the derive
# can be used.
serde = { version = "1.0.228", features = ["derive"] }
# Test-only: TokioIo adapts a tokio UnixStream to the hyper IO traits, which is
# what a client needs to speak gRPC over a unix socket. Kept on the same ^0.1
# line tonic itself depends on, so one copy is compiled.
hyper-util = { version = "0.1.20", features = ["tokio"] }
# libc: the raw syscall bindings agent-core's privs module needs. Deliberately the
# raw bindings and not a friendlier wrapper (nix, users, caps): the whole point of
# privs/ is that a reviewer reads the setgroups/setgid/setuid sequence in the order
# the kernel sees it, which a crate that hides the calls behind an RAII type takes
# away. It is used in exactly one module and nowhere else.
libc = "0.2.189"
thiserror = "2.0.21"
tempfile = "3.27"
# base64: an SSH public key is base64 text, and the agent DECODES it to prove it is a
# well-formed key of the algorithm it names before root writes it into an
# authorized_keys file (issue #135). Already in the lockfile beneath tonic, so no new
# code enters the tree; a hand-written decoder in a root process would be worse.
base64 = "0.22.1"
# "signal" and "time" are both load-bearing for the stop path and are named here
# rather than inherited from a transitive enable: "signal" registers the SIGTERM
# and SIGINT handlers without which the kernel's default action ends this root
# daemon instantly, mid-syscall, and "time" is the drain deadline that bounds how
# long a stop waits (agent/src/shutdown/). A feature the build happens to get
# because tonic asked for it is a feature that disappears on a dependency bump.
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
# Fleet mode (issue #180): the agent's own TLS acceptor, so that the listener can be TLS 1.3 only,
# time-limited and counted, none of which tonic's built-in TLS lets a caller set
# (research_notes/fleet-tls-research.md 1.1, 1.3). Both are ALREADY in the build beneath
# object_store -> reqwest, with the aws-lc-rs provider, so this adds no crate and no C build;
# `default-features = false` keeps `ring` (a second provider would make `ServerConfig::builder()`
# panic at run time) out of the selection, and every `ServerConfig` here names its provider
# explicitly. rustls >= 0.23.46 is the first line past RUSTSEC-2026-0285 (TLS 1.3 handshake
# messages accepted across encryption-level boundaries), which is the code this listener runs.
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["aws-lc-rs"] }
# Held on the 0.13 line deliberately. tonic 0.14 extracted prost codegen into the
# separate tonic-prost / tonic-prost-build crates, so moving requires new
# dependencies and a rewritten build.rs — a change that must not land without a
# real compile behind it.
# `tls-aws-lc` (fleet mode, issue #180): tonic's TLS server and the `TlsConnectInfo` a request
# carries its peer certificate in. aws-lc-rs is the provider rustls is ALREADY compiled with
# (it arrives through object_store -> reqwest, and `ring` is only a lockfile entry), so this
# turns on features of crates in the build and adds no crate and no C build. `tls-ring` would
# compile a second provider and make `ServerConfig::builder()` panic at run time, in code that
# only runs when the fleet flags are set (research_notes/fleet-tls-research.md 1.1).
tonic = { version = "0.13.1", features = ["tls-aws-lc"] }
tonic-build = "0.13.1"
# The audit layer (issue #106) is a `tower::Layer` on the server builder; tests also use
# `service_fn` as the connector tonic's Endpoint needs to dial something other than
# TCP. Same 0.5 line tonic depends on.
tower = { version = "0.5.3", features = ["util"] }
# The audit layer's types: the request/response/extension vocabulary of the HTTP/2
# service tonic wraps, the body trait whose frames the audit body wrapper passes
# through, and the pin projection that wrapper needs. All three are already in
# the lockfile beneath tonic and are pinned to the versions it holds.
http = "1.5.0"
http-body = "1.1.0"
pin-project-lite = "0.2.17"
# Test-only: builds the response bodies the audit body wrapper is driven with.
http-body-util = "0.1.5"
tracing = "0.1.44"
# The three crates that read and write the archive formats the file manager offers
# (issue #168). All three parse bytes a hosting customer chose, so each is pinned to an
# exact version, features are the least that works, and none of them is ever asked to
# touch the filesystem: the agent reads their members and writes every file itself,
# through descriptors, in a child that has dropped to the account (rules/security.md
# item 11; docs/superpowers/notes/2026-11-07-file-manager-archives-threat-note.md).
#
# `zip`: `deflate-flate2` only. The default features add C-backed bzip2 and zstd, AES
# decryption, LZMA and PPMd decoders, none of which the contract offers; stored and
# deflate are all a member may use, and anything else is refused by name. Held at 9.x
# deliberately: every earlier line carries advisories in its extraction helpers
# (RUSTSEC-2025-0168, RUSTSEC-2026-0367, -0368, -0369, -0429, all patched in 9.0.0),
# helpers this agent does not call but a reviewer should not have to prove unreachable.
zip = { version = "=9.1.3", default-features = false, features = ["deflate-flate2"] }
# `tar`: `default-features = false` drops `xattr`, which would let an archive member set
# extended attributes on a file. Entries are read and never unpacked by the crate;
# RUSTSEC-2026-0067 and -0068 are patched from 0.4.45.
tar = { version = "=0.4.46", default-features = false }
# `flate2`: the gzip layer of `.tar.gz`, and the deflate engine behind `zip`'s
# `deflate-flate2`. Default features: the pure-Rust backend (miniz_oxide), so no C
# library is linked into the root daemon.
flate2 = { version = "=1.1.10" }
# ECDSA P-384 / SHA-384 for the package a backup is moved between servers in (issue #127): the
# exporting host signs a manifest with the panel's per-server key and the importing host
# verifies it against the fingerprint the operator confirmed. rules/security.md item 9 names
# this scheme for artifacts and forbids home-grown crypto, and a hand-written ECDSA is exactly
# that. It is NOT a new crate: it is already compiled in as the provider beneath `rustls` and
# `object_store`. `default-features = false` with the non-FIPS backend and `alloc` is the
# least that signs and verifies; the defaults add `ring-io` and `ring-sig-verify`, which pull
# in `untrusted` for compatibility shims nothing here calls.
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["aws-lc-sys", "alloc"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Test-only: property tests for the validation types (plan 8, E4; owner decision D12). The
# validators are the root agent's input boundary, and an example-based test shows that the cases
# somebody thought of are refused; a property shows that no case a generator can reach is
# accepted wrongly, which is what spec section 19 asks of the mitigation for a root process.
# Pinned exactly (MIT OR Apache-2.0, no advisories on record, rust-version 1.85 against the
# edition-2024 toolchain here). `default-features = false, features = ["std"]` drops `fork`
# and `timeout` (a forking test runner, which pulls `rusty-fork` and `tempfile` into the test
# binary), `bit-set` and the macro attribute: the properties run in-process, from a fixed seed
# (`agent-core/src/tests/support/property_runs.rs`), and `std` is what the regex string
# strategies and OS-seeded generation need. A dev-dependency of agent-core only, so it never
# reaches the shipped binary.
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
missing_docs = "warn"
# deny, not forbid: forbid cannot be lowered by a crate, and agent-core::privs is
# the one documented exception (rules/rust.md "unsafe"). Every other crate root
# carries #![forbid(unsafe_code)], so the compiler — not a grep — is the gate.
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
