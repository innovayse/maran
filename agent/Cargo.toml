# Workspace manifest of maran-agent (rules/rust.md "Canonical agent layout").
# The clippy lints below are security controls, not taste: the agent runs as
# root, and a root process must return typed errors, never panic on input.

[workspace]
resolver = "3"
members = [
    "crates/agent",
    "crates/agent-core",
    "crates/distro",
    "crates/ops",
    "crates/templates",
]

[workspace.package]
version = "1.0.0-beta.2"
edition = "2024"
publish = false
license = "BUSL-1.1"

# Dependency versions live here so every crate in the workspace agrees on one.
[workspace.dependencies]
# The templates crate's render types derive `askama::Template`; the version is
# pinned here like every other workspace dependency.
askama = "0.12"
# Held on the 0.13 line to match tonic: tonic 0.13.1 requires prost ^0.13, and
# the 0.14 line moved prost codec support out of tonic into a separate crate.
prost = "0.13.5"
# Safe wrappers over the syscalls that have no answer in `std`. Two callers, both
# of which must reach a syscall without writing `unsafe` of their own — `unsafe`
# in this workspace lives in agent-core::privs and nowhere else (rules/rust.md
# "unsafe"), and an #[allow] elsewhere would be that exception growing a second
# home. The polygon suites READ the credentials and ownership a root-only test has
# to observe (getuid, getgroups, fchown, kill); maran-ops' monitoring area asks
# statvfs how full the root filesystem is. Already in the lockfile as tempfile
# depends on it, so no new code enters the tree.
rustix = { version = "1.1.4", features = ["process", "thread", "fs"] }
# `nft -j` answers in JSON, and maran-ops reads the firewall's ban list out of
# it. A hand-rolled JSON parser in a root daemon is worse than a vetted one.
# Read as `Value` by the firewall area and through derive by the backup area.
serde_json = "1.0.151"
# SHA-256, and the ONE hash the backup area computes: a backup's integrity check
# is security-relevant, so rules/security.md item 9 rules out MD5/SHA1 and rules
# out writing the digest ourselves ("no home-grown crypto"). The alternatives
# were both worse: spawning `sha256sum` puts a process and a parser between the
# agent and a number it can compute, and it is one more binary the preflight has
# to prove exists before 03:00. RustCrypto's implementation, MIT/Apache-2.0,
# `Digest` only.
sha2 = "0.11.0"
# The S3-compatible transport, and the ONE new dependency this plan adds. It is
# here rather than hand-written because SigV4 is signing, and rules/security.md
# item 9 forbids home-grown crypto outright — a request signer we wrote would be
# an HMAC-SHA256 canonicalisation nobody in this repository is qualified to
# review, failing closed only if we got every byte of the canonical request
# right. `aws` feature only: no Azure, no GCP, no generic HTTP store, and
# `default-features = false` drops the local-filesystem backend, which this
# product already has in `LocalObjectStoreHost` over `std::fs`. Apache-2.0 /
# MIT, and `maran licenses` covers whatever it drags in.
object_store = { version = "0.14.1", default-features = false, features = [
    "aws",
] }
# `derive` only, for the backup manifest. The manifest is a CONTRACT document —
# it is written by a creation and read back by a restore that refuses to proceed
# when the two disagree — and hand-written field-by-field JSON reading is exactly
# where a version field silently stops being checked. serde was already in the
# lockfile beneath `serde_json`; this makes it a direct dependency so the derive
# can be used.
serde = { version = "1.0.228", features = ["derive"] }
# Test-only: TokioIo adapts a tokio UnixStream to the hyper IO traits, which is
# what a client needs to speak gRPC over a unix socket. Kept on the same ^0.1
# line tonic itself depends on, so one copy is compiled.
hyper-util = { version = "0.1.20", features = ["tokio"] }
# libc: the raw syscall bindings agent-core's privs module needs. Deliberately the
# raw bindings and not a friendlier wrapper (nix, users, caps): the whole point of
# privs/ is that a reviewer reads the setgroups/setgid/setuid sequence in the order
# the kernel sees it, which a crate that hides the calls behind an RAII type takes
# away. It is used in exactly one module and nowhere else.
libc = "0.2.189"
thiserror = "2.0.20"
tempfile = "3.27"
# "signal" and "time" are both load-bearing for the stop path and are named here
# rather than inherited from a transitive enable: "signal" registers the SIGTERM
# and SIGINT handlers without which the kernel's default action ends this root
# daemon instantly, mid-syscall, and "time" is the drain deadline that bounds how
# long a stop waits (agent/src/shutdown/). A feature the build happens to get
# because tonic asked for it is a feature that disappears on a dependency bump.
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
# Held on the 0.13 line deliberately. tonic 0.14 extracted prost codegen into the
# separate tonic-prost / tonic-prost-build crates, so moving requires new
# dependencies and a rewritten build.rs — a change that must not land without a
# real compile behind it.
tonic = "0.13.1"
tonic-build = "0.13.1"
# Test-only: service_fn turns a closure into the connector tonic's Endpoint needs
# in order to dial something other than TCP. Same 0.5 line tonic depends on.
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
missing_docs = "warn"
# deny, not forbid: forbid cannot be lowered by a crate, and agent-core::privs is
# the one documented exception (rules/rust.md "unsafe"). Every other crate root
# carries #![forbid(unsafe_code)], so the compiler — not a grep — is the gate.
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
