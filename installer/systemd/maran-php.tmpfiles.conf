# The directory holding the PHP-FPM pool sockets, which the web server connects to.
# Installed as /etc/tmpfiles.d/maran-php.conf by installer/lib/70-services.sh.
#
# WHY A SIBLING OF /run/maran AND NOT A CHILD OF IT.
# /run/maran is the agent's private directory: root:<service group> 0750, holding the gRPC socket
# the panel reaches the root daemon through. The web server's user is neither root nor in that
# group, so a socket under /run/maran/ cannot be resolved by nginx: `connect(2)` fails EACCES at
# the parent and every PHP site answers 502. The two ways to fix that both weaken something worth
# keeping — adding the web user to the service group hands nginx the group-readable panel secrets,
# and opening /run/maran to "other" lets every tenant uid reach the agent's socket directory — so
# the sockets live in a directory of their own and /run/maran stays 0750.
#
# WHY systemd-tmpfiles AND NOT RuntimeDirectory= IN THE AGENT UNIT.
# Two reasons. A RuntimeDirectory= is removed when the unit stops, and with it every pool socket
# php-fpm is still listening on: stopping or upgrading the agent would 502 every PHP site until
# php-fpm was restarted. And php-fpm starts at boot independently of the agent, so the directory
# has to exist before either; systemd-tmpfiles-setup.service runs before sysinit.target, ahead of
# every ordinary unit. The agent unit therefore names this path in ReadWritePaths= and nothing else.
#
# WHAT EACH FIELD IS LOAD-BEARING FOR.
#   d          create the directory, and correct its mode and ownership if it already exists. /run
#              is a tmpfs, so on a normal boot this is a creation; `systemd-tmpfiles --create`
#              puts it back after a hand-edit on a running host.
#   0755       the web server's user must be able to resolve a path inside it, and it is neither
#              the owner nor in the group, so "other" needs the execute bit. Read is granted too:
#              a tenant can list the socket names (they are account names). What keeps a tenant
#              from CONNECTING is not this directory but each socket file, which the agent writes
#              as 0660 owned by that pool's own user and group.
#   root root  only root creates, renames or unlinks entries here, so no tenant can bind a socket
#              of its own under another pool's name or unlink someone else's.
#   -          no age-based cleanup. systemd-tmpfiles must never remove a live socket.
#
# Nothing here is substituted: the owner is root, the group is root and the path is fixed by
# AgentPaths::PHP_FPM_SOCKET_DIRECTORY, so no placeholder can survive into the installed file.
d /run/maran-php 0755 root root -
