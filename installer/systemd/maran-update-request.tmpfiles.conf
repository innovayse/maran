# The directory the panel puts its update request in (issue #382). Installed as
# /etc/tmpfiles.d/maran-update-request.conf by installer/lib/69-update-request.sh.
#
#   d          create the directory, and correct its mode and ownership if it exists.
#   0770       the panel's group can create and remove the marker; nobody else can even enter. The
#              directory is owned by root, inside root-owned /run, so the panel's account can never
#              rename or replace the directory itself, only the entries inside it. That is the reason it
#              is not under /var/lib/maran, which that account owns outright.
#   root       the owner.
#   __MARAN_GROUP__
#              the group the panel runs as, substituted by the installer step from MARAN_GROUP in
#              install.sh. A placeholder that survives substitution aborts the install.
#   -          no age-based cleanup: nothing here is ours to expire, and /run is cleared by a reboot.
d /run/maran-update-request 0770 root __MARAN_GROUP__ -
