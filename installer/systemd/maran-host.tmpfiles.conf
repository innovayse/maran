# The directory under which the agent's unit sees the HOST's shared temporary directories.
# Installed as /etc/tmpfiles.d/maran-host.conf by installer/lib/70-services.sh.
#
# WHY IT EXISTS. maran-agent.service runs with PrivateTmp=true, so its /tmp, /var/tmp are not the
# host's. A hosting account's processes, though, write into the HOST's /tmp, /var/tmp and /dev/shm,
# and those files stay behind owned by the account's numeric uid after `userdel`. The next account
# to be handed that uid inherits them. Deleting an account therefore has to sweep those three
# trees, and the agent cannot see them from inside its own namespace. The unit bind-mounts them
# at the paths below (BindPaths= in maran-agent.service); the reasoning and the threat model are in
# docs/superpowers/notes/2026-10-29-account-deletion-leftovers-threat-note.md.
#
# WHAT EACH FIELD IS LOAD-BEARING FOR.
#   d          create the directory, and correct mode and ownership if it already exists. /run is a
#              tmpfs, so on a normal boot this is a creation. The mount points must exist before the
#              unit starts: a missing BindPaths= target is not skipped.
#   0700 root  the host's /tmp is world-writable and these are windows onto it. Nobody but root has
#              any business resolving a path through them, and a tenant that could would be handed
#              a second, longer name for every file in the host's shared directories.
#   -          no age-based cleanup: systemd-tmpfiles must never reap a mount point.
#
# Nothing here is substituted: owner and group are root and the paths are fixed by the agent's
# AgentPaths constants, so no placeholder can survive into the installed file.
d /run/maran-host 0700 root root -
d /run/maran-host/tmp 0700 root root -
d /run/maran-host/var-tmp 0700 root root -
d /run/maran-host/dev-shm 0700 root root -
