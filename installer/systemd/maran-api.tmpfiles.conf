# The directory holding the panel's LISTENING SOCKET, and therefore the panel's trust boundary.
# Installed as /etc/tmpfiles.d/maran-api.conf by installer/lib/70-services.sh.
#
# WHY THIS FILE EXISTS RATHER THAN RuntimeDirectory= IN THE UNIT.
# systemd re-runs its exec-directory setup for EVERY command invocation of a unit, not once per
# start, and that setup re-applies the unit's User=/Group= to RuntimeDirectory=. An
# `ExecStartPre=+/usr/bin/chgrp <web group>` therefore takes effect inside its own invocation and
# is undone before the next one, so ExecStart always sees the directory owned panel:panel and
# nginx has no path to the socket: `connect(2)` from the web server's uid fails EACCES and every
# API call answers 502. Measured on booted systemd on both families (255 on Debian, 252 on RHEL).
# systemd has no per-RuntimeDirectory group setting, so the group has to be set by something the
# unit's own command invocations do not re-apply. systemd-tmpfiles is that something: it runs
# before the unit (systemd-tmpfiles-setup.service is ordered Before=sysinit.target, and every
# ordinary unit is After=sysinit.target), it re-asserts mode and ownership on a directory that
# already exists, and nothing in a unit's start, restart or reload touches it.
#
# WHAT EACH FIELD IS LOAD-BEARING FOR.
#   d          create the directory, and correct its mode and ownership if it already exists. /run
#              is a tmpfs, so on a normal boot this is a creation; after a hand-edit on a running
#              host, `systemd-tmpfiles --create` puts it back.
#   2710       0710 has NO permissions for "other": a uid that is neither panel nor a member of the
#              web server's group cannot resolve a path inside the directory, so `connect(2)` to
#              the socket fails at path resolution before any socket permission is consulted. This
#              is what stops a customer's cron entry or PHP script, and it holds from the
#              directory's first moment — including the window between Kestrel's bind and the panel
#              narrowing the socket to 0660. The leading 2 is setgid: the socket Kestrel creates
#              inside inherits this directory's group, which is how the panel — which holds no
#              capabilities at all (CapabilityBoundingSet= is empty in maran-api.service) and so
#              cannot chgrp anything — ends up with a socket in the web server's group without
#              being granted membership of it.
#   panel      the unit's User=. The panel must be able to create and unlink its own socket here.
#   <web group> the group nginx runs as, substituted from MARAN_WEB_SERVER_GROUP: www-data on the
#              Debian family, nginx on the RHEL family. install.sh's detect_web_server_identity is
#              the one place either name is decided.
#   -          no age-based cleanup. systemd-tmpfiles must never remove the live socket.
#
# __MARAN_API_SOCKET_DIR__ and __MARAN_WEB_GROUP__ are substituted by installer/lib/70-services.sh
# from MARAN_API_SOCKET_PATH and MARAN_WEB_SERVER_GROUP; a placeholder that survives substitution
# aborts the install rather than writing a snippet systemd-tmpfiles would refuse.
d __MARAN_API_SOCKET_DIR__ 2710 panel __MARAN_WEB_GROUP__ -
