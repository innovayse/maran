# Maran panel vhost. Installed by installer/lib/80-nginx.sh to
# /etc/nginx/conf.d/maran.conf (Debian family) or the equivalent RHEL-family
# include directory. Serves the SPA as static files with a fallback to index.html,
# and reverse-proxies API calls to maran-api, which listens on loopback only —
# nginx is the only process on the box with a socket reachable from outside it.
#
# Placeholders substituted by 80-nginx.sh at install time:
#   __MARAN_SERVER_NAME__   hostname or "_" (default catch-all) if none was given
#   __MARAN_CERT_PATH__     self-signed (or later, Let's Encrypt) certificate path
#   __MARAN_KEY_PATH__      matching private key path

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name __MARAN_SERVER_NAME__;

    ssl_certificate     __MARAN_CERT_PATH__;
    ssl_certificate_key __MARAN_KEY_PATH__;

    # Modern-only TLS: the panel is a fresh install with no legacy client requirement,
    # so there is no reason to keep TLS 1.0/1.1 or non-forward-secret ciphers alive.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MaranSSL:10m;
    ssl_session_tickets off;

    # --- Security headers (rules/security.md §7 crypto/transport, §10 agent surface) ---
    # HSTS: safe to send even before a real certificate authority is in play, since it
    # only governs same-origin behaviour for this exact hostname/port going forward.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # CSP: the SPA is a single first-party bundle with no third-party script/style
    # origins by default (rules/security.md §8: "no new outbound calls" beyond the
    # documented license lease, which is server-side, not browser-side) — connect-src
    # is scoped to 'self' since the API is same-origin behind this same vhost.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 64m;

    root /usr/local/maran/frontend;
    index index.html;

    # Proxy every API call to the api process, which binds loopback-only so nginx is
    # the sole path in from outside the host.
    location /api/ {
        # No trailing slash on proxy_pass: with one, nginx REPLACES the matched "/api/"
        # prefix, so /api/v1/accounts would arrive at the api as /v1/accounts and every
        # call would 404 — the api's own routes are "api/v1/..." (Maran.Sdk
        # BaseApiController) and the SPA calls them at that full path. The URI must be
        # passed through unchanged.
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Correlation-id passthrough (rules/security.md observability §15): if the
        # client already set one, forward it as-is; the api generates one otherwise.
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location /health {
        proxy_pass http://127.0.0.1:5080/health;
        proxy_set_header Host $host;
    }

    # SPA fallback: any path that isn't a real static file resolves to index.html so
    # the Vue router can handle client-side routes (e.g. a deep link into /sites/42).
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/maran/nginx-access.log;
    error_log  /var/log/maran/nginx-error.log;
}

# No plain-HTTP server block: Maran does not listen on port 80. Port 8443 is
# TLS-only, matching the "no new listening ports" rule (rules/security.md §8) —
# there is nothing to redirect from.
