# Maran panel vhost. Installed by installer/lib/80-nginx.sh to
# /etc/nginx/conf.d/maran.conf (Debian family) or the equivalent RHEL-family
# include directory. Serves the SPA as static files with a fallback to index.html,
# and reverse-proxies API calls to maran-api over a unix domain socket — nginx is
# the only process on the box that may open it, and the only one with a socket
# reachable from outside the host.
#
# Placeholders substituted by 80-nginx.sh at install time:
#   __MARAN_SERVER_NAME__   hostname or "_" (default catch-all) if none was given
#   __MARAN_CERT_PATH__     self-signed (or later, Let's Encrypt) certificate path
#   __MARAN_KEY_PATH__      matching private key path
#   __MARAN_API_SOCKET__    the api's listening socket, from MARAN_API_SOCKET_PATH

# The api, as an upstream rather than a literal in each proxy_pass. Two reasons, and the
# second is a correctness one. An upstream can be given a unix socket where a proxy_pass
# would need nginx's `unix:/path:` spelling, whose trailing colon separates the socket from
# a URI — and an empty URI there is exactly the ambiguity the /api/ location below cannot
# afford, since the request path must be forwarded UNCHANGED. Naming the upstream and
# passing no URI removes the question. The other reason is ordinary: the path is written
# once for both locations.
upstream maran_api {
    server unix:__MARAN_API_SOCKET__;
}

server {
    # HTTP/2 is asked for on the `listen` lines rather than with the separate `http2 on;`
    # directive, and the spelling is load-bearing rather than a style choice. `http2 on;`
    # arrived in nginx 1.25.1, while the installer takes nginx from the distribution
    # (installer/lib/20-dependencies.sh) and the supported matrix contains older ones.
    # Measured in the polygon images: Ubuntu 24.04 carries 1.24.0 and AlmaLinux 9 carries
    # 1.20.1, and on both `http2 on;` is an "unknown directive" that nginx refuses to load at
    # all — the panel served nothing on either family. The `listen ... http2` form is accepted
    # from 1.9.5 onwards and is deprecated-with-a-warning from 1.25.1; measured on 1.30.4,
    # `nginx -t` prints that warning and still succeeds. One spelling therefore loads
    # everywhere the panel is supported. When the deprecated form is eventually removed, step
    # 80's validation refuses the install and says so — but that gate runs on the customer's
    # server, not here.
    #
    # NO AUTOMATED GATE IN THIS REPOSITORY PARSES THIS FILE ON AN nginx >= 1.25.1. The polygon
    # images take nginx from the family they model — 1.24.0 on Ubuntu 24.04, 1.20.1 on
    # AlmaLinux 9 — so every build-time check of this vhost runs on a version that predates the
    # deprecation, and the day the form is removed upstream this repository will find out from an
    # operator. Closing it needs a CI job of its own rather than a change here: render this
    # template with 80-nginx.sh's own render_vhost and run `nginx -t` over it in a
    # `nginx:mainline` container, added to the matrix at .github/workflows/agent.yml. Written down
    # because the recommendation was made, accepted and deferred, and a deferral that lives only
    # in a review is one nobody reads again.
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name __MARAN_SERVER_NAME__;

    ssl_certificate     __MARAN_CERT_PATH__;
    ssl_certificate_key __MARAN_KEY_PATH__;

    # Modern-only TLS: the panel is a fresh install with no legacy client requirement,
    # so there is no reason to keep TLS 1.0/1.1 or non-forward-secret ciphers alive.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MaranSSL:10m;
    ssl_session_tickets off;

    # --- Security headers (rules/security.md §7 crypto/transport, §10 agent surface) ---
    # HSTS: safe to send even before a real certificate authority is in play, since it
    # only governs same-origin behaviour for this exact hostname/port going forward.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # CSP: the SPA is a single first-party bundle with no third-party script/style
    # origins by default (rules/security.md §8: "no new outbound calls" beyond the
    # documented license lease, which is server-side, not browser-side) — connect-src
    # is scoped to 'self' since the API is same-origin behind this same vhost.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 64m;

    root /usr/local/maran/frontend;
    index index.html;

    # Proxy every API call to the api process, which listens on a unix socket only, in a
    # directory only this server's group may traverse — so nginx is the sole path to the
    # panel from anywhere, including from other processes on this same machine.
    location /api/ {
        # No URI part on proxy_pass: with one, nginx REPLACES the matched "/api/" prefix,
        # so /api/v1/accounts would arrive at the api as /v1/accounts and every call would
        # 404 — the api's own routes are "api/v1/..." (Maran.Sdk BaseApiController) and the
        # SPA calls them at that full path. Naming the upstream and nothing else is what
        # passes the URI through unchanged.
        proxy_pass http://maran_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Correlation-id passthrough (rules/security.md observability §15): if the
        # client already set one, forward it as-is; the api generates one otherwise.
        proxy_set_header X-Correlation-Id $http_x_correlation_id;

        # Server-sent event streams (the site log tail) live in this location too, and two
        # nginx defaults are wrong for them. proxy_buffering collects the response before
        # forwarding it, so a log pane would update in bursts or not at all - the api also
        # sends X-Accel-Buffering: no per response, and this is the static half of the same
        # instruction. proxy_read_timeout defaults to 60s, which closes the upstream
        # connection on any quiet log; the api heartbeats every 15s to stay inside it, and
        # this value gives that heartbeat room to be late without the stream being torn
        # down with no ending event - the silent truncation the log endpoint is built to
        # never produce.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass http://maran_api/health;
        proxy_set_header Host $host;
    }

    # SPA fallback: any path that isn't a real static file resolves to index.html so
    # the Vue router can handle client-side routes (e.g. a deep link into /sites/42).
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/maran/nginx-access.log;
    error_log  /var/log/maran/nginx-error.log;
}

# No plain-HTTP server block: Maran does not listen on port 80. Port 8443 is
# TLS-only, matching the "no new listening ports" rule (rules/security.md §8) —
# there is nothing to redirect from.
