# Maran panel vhost. Installed by installer/lib/80-nginx.sh to
# /etc/nginx/conf.d/maran.conf (Debian family) or the equivalent RHEL-family
# include directory. Serves the SPA as static files with a fallback to index.html,
# and reverse-proxies API calls to maran-api over a unix domain socket — nginx is
# the only process on the box that may open it, and the only one with a socket
# reachable from outside the host.
#
# Placeholders substituted by 80-nginx.sh at install time:
#   __MARAN_SERVER_NAME__   the machine's host name (host_display_name, lower-cased; "localhost" if none)
#   __MARAN_CERT_PATH__     self-signed (or later, Let's Encrypt) certificate path
#   __MARAN_KEY_PATH__      matching private key path
#   __MARAN_API_SOCKET__    the api's listening socket, from MARAN_API_SOCKET_PATH
#   __MARAN_FILES_BODY_LIMIT__  the largest request body the file-transfer location accepts, in bytes:
#                           the panel's Files__MaxUploadBytes plus a fixed allowance (80-nginx.sh)

# The api, as an upstream rather than a literal in each proxy_pass. Two reasons, and the
# second is a correctness one. An upstream can be given a unix socket where a proxy_pass
# would need nginx's `unix:/path:` spelling, whose trailing colon separates the socket from
# a URI — and an empty URI there is exactly the ambiguity the /api/ location below cannot
# afford, since the request path must be forwarded UNCHANGED. Naming the upstream and
# passing no URI removes the question. The other reason is ordinary: the path is written
# once for both locations.
upstream maran_api {
    server unix:__MARAN_API_SOCKET__;
}

# The request path WITHOUT its query string, for the log format below.
#
# nginx offers no such variable. `$request_uri` is the original request target and carries the
# query string; `$uri` has no query string but is rewritten by `try_files`, so every SPA route
# would be logged as `/index.html` and the log would stop naming the page that was asked for —
# measured, not assumed. So the path is cut out of `$request_uri` here, where no rewrite can
# reach it: the regular expression stops at the first `?`, and a request target with no query
# string matches the whole of it.
#
# The `default` arm is not decoration. A map whose regular expression does not match yields an
# empty string, and an empty request in the log is a line that says a request arrived and
# nothing about which one — the failure mode of a log that has quietly stopped observing. `^`
# plus `[^?]*` matches every possible value including the empty one, so the arm is unreachable
# today and exists so that a later edit to the expression cannot silently blank the log.
map $request_uri $maran_request_path {
    ~^(?<maran_path_without_query>[^?]*)  $maran_path_without_query;
    default                               $request_uri;
}

# The panel vhost's access log format. It is `combined` with TWO substitutions: `"$request"`,
# which is the raw request line and therefore carries the query string, becomes the method, the
# query-free path and the protocol; and `"$http_referer"`, which is the full address of the page
# that made the request, query string included, becomes a literal "-" (issue #465). A browser
# sends the referrer of an SPA page on every request that page makes, so a password-reset or
# invitation link (`/reset-password?token=...`) would otherwise reach this file through the
# Referer of the API calls the page issues, with the query string cut out of the request line
# and still present one field to its right. The vhost also sends `Referrer-Policy: no-referrer`
# and the SPA moves the token out of its address (frontend/src/stores/linkToken.ts), so this is
# the third line of defence, and the one that holds for a client that ignores the policy.
#
# WHY, and it is not tidiness (rules/security.md item 8: secrets never in logs or URLs). nginx's
# built-in `combined` applies whenever no format is named, and it logged the installer's one-time
# setup token — permission to become the panel's administrator — into
# /var/log/maran/nginx-access.log the moment the operator opened the link the installer printed.
# That file is inside a directory readable by every uid in the panel's own service group and,
# until the rotation policy this change also adds, nothing ever removed it. The token itself no
# longer travels in a URL (installer/lib/90-finish.sh), which is the fix for that leak; this
# format is the second line of defence, and it is the one that holds for a secret nobody has
# thought of yet — a password-reset link, a signed download, a token an operator constructs by
# hand — because it makes the panel vhost structurally unable to log a query string.
#
# WHAT IT COSTS, stated rather than glossed: query strings are gone from this log for every
# request, so an operator debugging the panel can no longer see which page, filter or id an API
# call named. That cost is bounded — the api logs its own requests with their parameters through
# Serilog to journald (backend/src/Maran.Host/Extensions/ObservabilityExtensions.cs), so the
# information is not lost from the host, only from this file — and it buys a log that cannot leak
# a credential. The reverse trade, keeping the query string and naming the one location that must
# not log it, was rejected: it protects the paths somebody remembered to name.
#
# Control characters are not a way around this. nginx's default escaping for a log_format
# (`escape=default`, the behaviour since 1.11.8) renders `"`, `\` and every byte below 0x20 as
# `\xXX`, so a request target containing a newline cannot forge a second log line — the same
# protection `combined` has, kept rather than given up by writing the format out.
log_format maran_no_query '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $maran_request_path $server_protocol" '
                          '$status $body_bytes_sent "-" "$http_user_agent"';

server {
    # HTTP/2 is asked for on the `listen` lines rather than with the separate `http2 on;`
    # directive, and the spelling is load-bearing rather than a style choice. `http2 on;`
    # arrived in nginx 1.25.1, while the installer takes nginx from the distribution
    # (installer/lib/20-dependencies.sh) and the supported matrix contains older ones.
    # Measured in the polygon images: Ubuntu 24.04 carries 1.24.0 and AlmaLinux 9 carries
    # 1.20.1, and on both `http2 on;` is an "unknown directive" that nginx refuses to load at
    # all — the panel served nothing on either family. The `listen ... http2` form is accepted
    # from 1.9.5 onwards and is deprecated-with-a-warning from 1.25.1; measured on 1.30.4,
    # `nginx -t` prints that warning and still succeeds. One spelling therefore loads
    # everywhere the panel is supported. When the deprecated form is eventually removed, step
    # 80's validation refuses the install and says so — but that gate runs on the customer's
    # server, not here.
    #
    # NO AUTOMATED GATE IN THIS REPOSITORY PARSES THIS FILE ON AN nginx >= 1.25.1. The polygon
    # images take nginx from the family they model — 1.24.0 on Ubuntu 24.04, 1.20.1 on
    # AlmaLinux 9 — so every build-time check of this vhost runs on a version that predates the
    # deprecation, and the day the form is removed upstream this repository will find out from an
    # operator. Closing it needs a CI job of its own rather than a change here: render this
    # template with 80-nginx.sh's own render_vhost and run `nginx -t` over it in a
    # `nginx:mainline` container, added to the matrix at .github/workflows/agent.yml. Written down
    # because the recommendation was made, accepted and deferred, and a deferral that lives only
    # in a review is one nobody reads again.
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name __MARAN_SERVER_NAME__;

    ssl_certificate     __MARAN_CERT_PATH__;
    ssl_certificate_key __MARAN_KEY_PATH__;

    # Modern-only TLS: the panel is a fresh install with no legacy client requirement,
    # so there is no reason to keep TLS 1.0/1.1 or non-forward-secret ciphers alive.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MaranSSL:10m;
    ssl_session_tickets off;

    # --- Security headers (rules/security.md §7 crypto/transport, §10 agent surface) ---
    # HSTS: safe to send even before a real certificate authority is in play, since it
    # only governs same-origin behaviour for this exact hostname/port going forward.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    # no-referrer, not same-origin: with same-origin a browser sends the FULL address of the page,
    # query string included, as the Referer of every same-origin request the page makes, and a
    # mailed link (`/reset-password?token=...`) carries a live credential in exactly that query
    # string (issue #465). The panel has no screen that needs to tell another of its own pages
    # where a request came from.
    add_header Referrer-Policy "no-referrer" always;
    # CSP: the SPA is a single first-party bundle with no third-party script/style
    # origins by default (rules/security.md §8: "no new outbound calls" beyond the
    # documented license lease, which is server-side, not browser-side) — connect-src
    # is scoped to 'self' since the API is same-origin behind this same vhost.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 64m;

    root /usr/local/maran/frontend;
    index index.html;

    # Proxy every API call to the api process, which listens on a unix socket only, in a
    # directory only this server's group may traverse — so nginx is the sole path to the
    # panel from anywhere, including from other processes on this same machine.
    location /api/ {
        # No URI part on proxy_pass: with one, nginx REPLACES the matched "/api/" prefix,
        # so /api/v1/accounts would arrive at the api as /v1/accounts and every call would
        # 404 — the api's own routes are "api/v1/..." (Maran.Sdk BaseApiController) and the
        # SPA calls them at that full path. Naming the upstream and nothing else is what
        # passes the URI through unchanged.
        proxy_pass http://maran_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Correlation-id passthrough (rules/security.md observability §15): if the
        # client already set one, forward it as-is; the api generates one otherwise.
        proxy_set_header X-Correlation-Id $http_x_correlation_id;

        # Server-sent event streams (the site log tail) live in this location too, and two
        # nginx defaults are wrong for them. proxy_buffering collects the response before
        # forwarding it, so a log pane would update in bursts or not at all - the api also
        # sends X-Accel-Buffering: no per response, and this is the static half of the same
        # instruction. proxy_read_timeout defaults to 60s, which closes the upstream
        # connection on any quiet log; the api heartbeats every 15s to stay inside it, and
        # this value gives that heartbeat room to be late without the stream being torn
        # down with no ending event - the silent truncation the log endpoint is built to
        # never produce.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # File transfer: the raw-body upload and the streamed download of the file manager
    # (backend/src/Maran.Modules/Files/Controllers/FilesTransferController.cs). A regular-expression
    # location, which nginx prefers over the plain "/api/" prefix above, and anchored so that it
    # matches these two routes and nothing else; the general location keeps the server-wide 64m limit.
    #
    # client_max_body_size is the one number here that comes from configuration: 80-nginx.sh renders it
    # from the same panel.env variable the panel reads (Files__MaxUploadBytes), so the proxy and the
    # API cannot disagree about how large an upload may be. It is a ceiling for the proxy, not the
    # limit: the API counts the bytes itself and refuses at its own cap with a problem document.
    #
    # proxy_request_buffering off hands the body to the API as it arrives instead of spooling it to
    # nginx's temporary directory first, so a 100 MiB upload costs no disk and the first byte reaches
    # the agent while the browser is still sending. The price is that a slow client holds an upstream
    # connection open for as long as it takes: that is bounded by the API's per-account and per-host
    # transfer slots and by client_body_timeout below, not by nginx buffering. proxy_buffering off
    # does the same for the download, so the response is forwarded as the agent produces it.
    #
    # The timeouts are sized for a large file on a slow link and are idle timeouts (nginx restarts
    # them on every read or write), not a ceiling on the whole transfer.
    location ~ ^/api/v1/files/(upload|download)$ {
        client_max_body_size __MARAN_FILES_BODY_LIMIT__;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;

        proxy_pass http://maran_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    # Moving an account between Maran servers (issue #127). Three locations, each anchored so it matches the
    # routes named and nothing else; the general location keeps the server-wide 64m limit and its buffering.
    #
    # The UPLOAD of a package (POST /api/v1/account-imports, exact match: the same path answers the list on GET,
    # which carries no body). client_max_body_size is the one number here that is not a round figure: it is the
    # package ceiling the panel enforces itself (MigrationPackageLimits.MaxArtifactBytes, 256 GiB, a constant
    # and not a setting) plus 4 MiB for the two signed documents ahead of the artifact (MaxHeaderBytes, 1 MiB
    # each, and their signatures). The API counts the bytes itself and refuses past its own cap with a problem
    # document; this is the proxy's ceiling in front of it, and the polygon assertion in
    # docker/polygon/asserts/parts/nginx.sh compares it with that sum. proxy_request_buffering off hands the
    # body to the API as it arrives, so a package of hundreds of gigabytes costs no nginx spool on the system
    # disk; proxy_buffering off does the same for the (small) answer. The timeouts are idle timeouts: the API
    # reads the whole body before it answers, so the read timeout must outlast the transfer.
    location = /api/v1/account-imports {
        client_max_body_size 274882101248;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 14400s;
        proxy_send_timeout 14400s;

        proxy_pass http://maran_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    # The PULL of a package by this panel from another one (POST /api/v1/account-imports/pull): the body is a
    # few hundred bytes, but the API answers only after it has fetched the whole package, so the read timeout
    # is sized for the transfer and not for the request. The body limit stays at the server-wide 64m.
    location = /api/v1/account-imports/pull {
        proxy_buffering off;
        proxy_read_timeout 14400s;
        proxy_send_timeout 14400s;

        proxy_pass http://maran_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    # The DOWNLOAD of a package: an administrator's (GET /api/v1/account-exports/<id>/package) and another
    # panel's pull (GET /api/v1/migration-pull/head and /package). proxy_buffering off forwards the response as
    # the agent produces it instead of spooling hundreds of gigabytes to nginx's temporary directory first,
    # which would be a second plaintext copy of a customer's data on the system disk; the timeouts are idle
    # timeouts for a slow link. Authentication is the API's: nothing here widens who may ask.
    location ~ ^/api/v1/(account-exports/[0-9a-fA-F-]+/package|migration-pull/(head|package))$ {
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_pass http://maran_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    # File-manager work the agent does in one call and that can outlast the general location's
    # timeouts: building and unpacking an archive, copying a large tree, emptying the trash. The
    # bodies are small, so only the timeouts differ from the general location - the body limit and
    # the buffering stay as they are.
    location ~ ^/api/v1/files/(archive|extract|copy|trash|delete)$ {
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;

        proxy_pass http://maran_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    # The isolated frames of packaged modules (issue #185): the generated document and the signed
    # static assets of one module's screen, served by the API from /module-frames/{id}/{version}/.
    # The shell embeds them in a sandboxed iframe (sandbox="allow-scripts", an opaque origin), so this
    # is the ONE location of the vhost that must be framable, and it is framable by the panel's own
    # pages only: the API answers with `frame-ancestors 'self'`, and that response header passes
    # through here untouched.
    #
    # THE HEADER SET IS COMPLETE ON PURPOSE. nginx inherits `add_header` from the enclosing level only
    # when the location declares NONE of its own: the moment one appears, every server-level header
    # (X-Frame-Options DENY, the shell's CSP with `frame-ancestors 'none'`) is dropped for this
    # location. That replacement is what lets the frame load, and it is also why the three headers a
    # response from here still needs are repeated below instead of being assumed. What is NOT repeated,
    # and must never be added: X-Frame-Options (DENY would block the panel's own iframe; SAMEORIGIN
    # is redundant beside the API's frame-ancestors) and a Content-Security-Policy (the API sends the
    # frame's own, which allows only its own script and no request at all - connect-src 'none'; a
    # second policy here would be intersected with it and could only weaken what the API wrote).
    # /api/ keeps the server-level set, DENY included, because it declares no add_header of its own.
    # A header added at server level later is NOT inherited here: add it here too, or this location
    # silently goes without it (the polygon assertion
    # `assert_the_module_frame_location_has_its_own_headers_and_api_keeps_deny` reads both).
    #
    # No request body is ever meant to arrive (the route answers GET), so the limit is a kilobyte
    # rather than the server-wide 64m. Buffering stays on: the answers are finite files, not streams.
    location /module-frames/ {
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        client_max_body_size 1k;

        # No URI part on proxy_pass, for the reason /api/ gives: the path must reach the API unchanged.
        proxy_pass http://maran_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location /health {
        proxy_pass http://maran_api/health;
        proxy_set_header Host $host;
    }

    # SPA fallback: any path that isn't a real static file resolves to index.html so
    # the Vue router can handle client-side routes (e.g. a deep link into /sites/42).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Both files are created and opened by the nginx MASTER process, which is root — on every
    # start, every reload and every rotation (which reloads, issue #490) — so the directory holding them must be one
    # no other uid can create an entry in. It is: installer/lib/40-user.sh makes /var/log/maran
    # root:<service group> 0750, and the panel writes under /var/log/maran/panel instead. While the panel
    # uid owned this directory, it could unlink either name below and leave a symbolic link, and
    # nginx was measured following one and appending an attacker-chosen request line into a
    # root-owned 0600 file
    # (docs/superpowers/notes/2026-09-07-installer-privileged-steps-threat-note.md).
    #
    # There is no gate that can be placed in front of these two opens: nginx recreates the files
    # itself, as root, at the paths named here. The directory's ownership is the whole defence,
    # which is why moving these logs anywhere a non-root uid owns reopens the escalation and no
    # assertion in this file could see it.
    # `maran_no_query` and not the default `combined`: the format is declared at the top of this
    # file and the reason is written there. There are two access_log directives in this file — this
    # one and the port-80 challenge block's (issue #132), both with this format — and the polygon assertion
    # `assert_the_panel_vhost_can_never_log_a_query_string` enumerates them all rather than
    # checking this one, so a location added later with a log of its own is named by that
    # assertion instead of quietly reinstating `combined`.
    access_log /var/log/maran/nginx-access.log maran_no_query;
    # The error log takes NO format, and nothing here can give it one: nginx writes
    # `request: "<the raw request line>"` into it for any request that errors, query string
    # included. So a secret in a URL reaches this file whatever the access log is told to do —
    # which is why the setup token no longer travels in one (installer/lib/90-finish.sh) and why
    # the access-log format above is the second line of defence and not the fix.
    error_log  /var/log/maran/nginx-error.log;
}

# The panel's plain-HTTP ACME challenge block is NOT in this file: it lives in
# installer/nginx/maran-port80.conf, installed beside this one, because it is the only thing in the
# panel's nginx configuration that binds port 80 and port 80 belongs to the site web server. While
# Apache is the site web server the agent takes that file out of nginx's tree (issue #517), so this
# file binds 8443 and nothing else.
