# Maran panel ACME challenge block. Installed by installer/lib/80-nginx.sh to
# /etc/nginx/conf.d/maran-port80.conf beside the panel vhost (maran.conf), and a file of its own for
# one reason: it is the ONLY thing in the panel's nginx configuration that binds port 80, and port 80
# belongs to the site web server (docs/apps/README.md). While nginx is the site web server this file
# is in place; when the agent installs Apache it takes this file out of nginx's tree and reloads
# nginx BEFORE it starts Apache (the challenge is then answered by Apache's maran-acme.conf from the
# same webroot), and it puts the file back after Apache is removed. nginx then binds 8443 only.
#
# Placeholders substituted by 80-nginx.sh at install time:
#   __MARAN_SERVER_NAME__   the machine's host name, the same string maran.conf is rendered with

# The access-log format of this block. It cannot share maran.conf's `maran_no_query`: conf.d files
# load in a collation-dependent order and a format used before it is declared stops nginx from
# starting, so each file declares what it uses. Here `$uri` is the path without its query string and
# is not rewritten, because no `try_files` or `rewrite` is in this block, so the log still cannot
# record a query string (rules/security.md item 8).
log_format maran_acme_no_query '$remote_addr - $remote_user [$time_local] '
                               '"$request_method $uri $server_protocol" '
                               '$status $body_bytes_sent "-" "$http_user_agent"';

# The panel's ONE plain-HTTP block, and it serves exactly one thing: the ACME HTTP-01 challenge
# for the panel's own host name (issue #132). A certificate authority validates a name by fetching
# http://<name>/.well-known/acme-challenge/<token> on port 80, and the panel's interface is on
# 8443, so without this block a trusted certificate for the panel's name could never be issued.
#
# While nginx is the site web server it already listens on 80 for every hosted site, and the
# firewall decides whether 80 is reachable exactly as it does for a site's own validation. It names
# only the panel's host name, which #96 reserves from every tenant, so no site's vhost can claim the
# same name on 80. Everything but the challenge directory is 404 — it is not a second way into the
# panel, and it redirects nowhere. The directory (/var/lib/maran-acme) is root-owned and written
# only by the agent (`WritePanelChallenge`), refused below the agent's free-space floor.
server {
    listen 80;
    listen [::]:80;
    server_name __MARAN_SERVER_NAME__;

    location ^~ /.well-known/acme-challenge/ {
        alias /var/lib/maran-acme/;
        default_type text/plain;
    }

    location / {
        return 404;
    }

    # The same file as the TLS block of maran.conf, with this file's own query-free format.
    access_log /var/log/maran/nginx-access.log maran_acme_no_query;
    error_log  /var/log/maran/nginx-error.log;
}
