// System-level agent operations: identity/handshake.
syntax = "proto3";

package maran.agent.v1;

// Pins the generated C# namespace to Maran's PascalCase convention
// (protoc's default title-casing would otherwise yield "Maran...").
// Codegen-only: does not affect the wire format or the Rust side.
option csharp_namespace = "Maran.Agent.V1";

import "agent/v1/common.proto";

// Agent identity and environment. The API asks for it when it starts, on
// every health and readiness request, and before it shows the backup root —
// not on every connect, and not before each operation.
service SystemService {
  // Returns agent version and distro info. The API accepts the handshake only
  // when proto_version lies inside the window of revisions it was built for,
  // older AND newer refused alike (rules/proto.md "The contract revision").
  // Outside it the handshake is refused, /health reports the agent
  // "incompatible", /health/ready answers 503, and the API logs the mismatch
  // at startup. The API keeps running, and the verdict is asked again on every
  // health request, so finishing the upgrade clears it without a restart.
  // Operations are not re-checked per call.
  rpc GetAgentInfo(GetAgentInfoRequest) returns (GetAgentInfoResponse);
}

// Empty request — present for additive evolution.
message GetAgentInfoRequest {}

// Handshake result.
message GetAgentInfoResponse {
  oneof result {
    AgentInfo ok = 1;
    AgentError error = 2;
  }
}

// Identity of a running agent.
message AgentInfo {
  // Semantic version of the agent binary, e.g. "0.1.0".
  string version = 1;
  // /etc/os-release ID, e.g. "ubuntu", "almalinux".
  string distro_id = 2;
  // Detected distro family driving the adapter choice.
  DistroFamily family = 3;
  // Revision of this contract (proto/agent/v1/) the agent was built from,
  // raised by every change the contract baseline records (rules/proto.md
  // "The contract revision"). 1 is every agent built before revisions were
  // counted and names no contract; 0 means the sender did not set the field.
  uint32 proto_version = 4;
  // Absolute directory this agent writes account backup archives into, as the
  // agent's own constant `AgentPaths::BACKUP_ROOT` states it, e.g.
  // "/var/backups/maran". It is reported and never accepted: BackupDestination
  // refuses a LOCAL destination that carries a path, so this is the panel's
  // only way to KNOW the directory instead of restating it. Empty means the
  // agent predates this field, and a caller that reads it MUST then say it
  // does not know the path rather than assume a default — an assumed default
  // shown as fact is the untruth this field exists to end.
  string backup_root = 5;
}

// Supported distro families (spec §4).
enum DistroFamily {
  // Never sent by an agent: proto3 requires a zero value, and receiving it
  // means the sender is older than the field.
  DISTRO_FAMILY_UNSPECIFIED = 0;
  // Ubuntu and Debian: apt, sites-available, the www-data account.
  DISTRO_FAMILY_DEBIAN = 1;
  // AlmaLinux and Rocky: dnf, conf.d, the nginx account, SELinux contexts.
  DISTRO_FAMILY_RHEL = 2;
}
