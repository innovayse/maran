// Database and database-user lifecycle (MySQL/MariaDB). Passwords are always
// caller-supplied: the agent never generates a credential and never stores one,
// so the panel is the single place a password is minted.
//
// Corrected 2026-09-01, comment only. This header used to say the panel
// persists the password "(encrypted) for one-time display to the customer".
// That is not the design and must not be re-introduced: NOBODY keeps a copy.
// The panel mints the password, shows it once, and forgets it; the agent passes
// it to the server and forgets it; the SERVER holds its own hash, which is the
// only copy in the system. A stored copy — however it is encrypted — is a copy
// that can be read out of the panel's database, and a panel that can read back
// every customer's database password is a single theft away from every
// customer's data. A customer who has lost the password gets a new one set, not
// the old one shown. Nothing in this contract carries a password back: no
// response message here has a password field, and none may be added.
syntax = "proto3";

package maran.agent.v1;

option csharp_namespace = "Maran.Agent.V1";

import "agent/v1/common.proto";

service DbService {
  // Creates a database and a user granted full privileges on it only,
  // using the password supplied by the caller. Idempotent: if a database
  // and user with the same names already exist, returns AlreadyExists
  // without changing the existing password.
  rpc CreateDatabase(CreateDatabaseRequest) returns (CreateDatabaseResponse);

  // Drops a database and its dedicated user. Idempotent: dropping a
  // non-existent database returns NotFound.
  rpc DropDatabase(DropDatabaseRequest) returns (DropDatabaseResponse);

  // Lists databases owned by an account.
  rpc ListDatabases(ListDatabasesRequest) returns (ListDatabasesResponse);

  // Added 2026-09-02. Sets an existing database user's password. This is the
  // ONLY way to change one, and it exists because nobody keeps a copy: the
  // panel mints a password, shows it once and forgets it, so a customer who
  // lost theirs has no way back except being given a new one. CreateDatabase
  // deliberately does NOT reset the password of a pair that already exists —
  // that is what makes a retried creation safe — which leaves this rpc as the
  // whole of the recovery path.
  //
  // Idempotent in the only sense a password change can be: setting a password
  // twice leaves the user with the second one. A user that does not exist is
  // NotFound rather than silently created, because creating one here would
  // mint a credential for a database the panel has no row for.
  //
  // Nothing is returned but success: the caller already holds the value it
  // sent, and no response message in this file carries a password.
  rpc SetDatabasePassword(SetDatabasePasswordRequest) returns (SetDatabasePasswordResponse);

  // Reads the on-disk size of a database.
  rpc GetDatabaseSize(GetDatabaseSizeRequest) returns (GetDatabaseSizeResponse);

  // Added 2026-09-13. Rewrites the grants this agent issued before it escaped
  // the database name, and refuses everything else.
  //
  // A database-level GRANT's database name is a LIKE-style pattern: `_` matches
  // any single character and backtick-quoting does not turn it off. Every name
  // here is `<account>_<suffix>`, so every grant an older agent issued is stored
  // in mysql.db as a pattern, and a customer holding a colliding legal account
  // name reads AND writes a neighbour's database with their own credential —
  // measured against a real MariaDB, see
  // docs/superpowers/notes/2026-09-13-grant-pattern-threat-note.md. The escape
  // shipped for new grants; the rows already on a host were never rewritten,
  // and this rpc is that rewrite.
  //
  // Host-wide and NOT per account, deliberately: the defect is a property of
  // the server's grant table, an operator repairing a host cannot enumerate
  // every account that ever existed, and a per-account pass would leave the
  // rows of a deleted-and-recreated account behind.
  //
  // Idempotent in the strongest sense available: a row already holding the
  // escaped form is reported as already correct and no statement is sent for
  // it, so a second call and a call against a clean install are both no-ops.
  // Anything the agent cannot confidently identify as a grant IT issued — a
  // grant from another host, a name pair no account could produce, privileges
  // narrower than the ones it grants, an unfamiliar escape — is left untouched
  // and reported as refused, because this operation revokes and re-issues a
  // customer's live database access and guessing is an outage.
  rpc RepairDatabaseGrants(RepairDatabaseGrantsRequest) returns (RepairDatabaseGrantsResponse);

  // Added 2026-11-07 (issue #156). Creates an additional login for an account,
  // granted NOTHING. A login is granted on databases separately, by
  // SetDatabaseUserPrivileges; the dedicated login CreateDatabase makes is a
  // login like any other once it exists.
  //
  // The login can connect from 'localhost' only: nothing in this contract opens
  // a database login to a network address.
  //
  // Idempotent in the way CreateDatabase is: a login that already exists is
  // AlreadyExists, and its password is NOT changed, so a retried creation
  // cannot reset a credential the customer was already shown.
  rpc CreateDatabaseUser(CreateDatabaseUserRequest) returns (CreateDatabaseUserResponse);

  // Added 2026-11-07 (issue #156). Drops a login and, with it, every privilege
  // it holds. Idempotent: a login that is not on the server is NotFound.
  //
  // The agent does not know which login is a database's dedicated one and does
  // not decide whether a login MAY be dropped on its own: that rule belongs to
  // the panel, which holds the rows. This rpc only does what it is told for a
  // login of the named account.
  rpc DropDatabaseUser(DropDatabaseUserRequest) returns (DropDatabaseUserResponse);

  // Added 2026-11-07 (issue #156). Makes a login's privileges on ONE database
  // exactly the set given: it grants what is missing and revokes what is
  // surplus, in that order, so an interruption leaves the login with too much
  // and never with nothing. An empty set revokes everything the login holds on
  // that database.
  //
  // Idempotent: a login already holding exactly the set is left alone. A login
  // or a database that is not on the server is NotFound; nothing is created.
  //
  // The set is closed (DatabasePrivilege): GRANT OPTION and every global or
  // administrative privilege cannot be named. A grant option found on the
  // login's row for that database is revoked, whatever set was asked for.
  rpc SetDatabaseUserPrivileges(SetDatabaseUserPrivilegesRequest) returns (SetDatabaseUserPrivilegesResponse);
}

message CreateDatabaseRequest {
  // System username of the owning account; database and user names are
  // namespaced under it by the agent (e.g. "acc12345_shop").
  string account_username = 1;
  // Database name suffix chosen by the customer, validated against the
  // agent's identifier allow-list regex.
  string database_name = 2;
  // Username suffix for the dedicated database user.
  string db_username = 3;
  // Plaintext password for the new database user, supplied by the caller.
  // Never logged; not echoed back in any response or error.
  string password = 4;
}

message CreateDatabaseResponse {
  oneof result {
    CreateDatabaseOk ok = 1;
    AgentError error = 2;
  }
}

message CreateDatabaseOk {
  // Fully-qualified database name as created, e.g. "acc12345_shop".
  string database_name = 1;
  // Fully-qualified database username as created.
  string db_username = 2;
}

// Corrected 2026-09-01. `database_name` used to be documented as the
// FULLY-QUALIFIED name. It is now the same suffix CreateDatabaseRequest takes,
// and the agent re-applies the account prefix itself, because a fully-qualified
// name off the wire is a request that can name ANOTHER tenant's database. The
// agent has no way to authorise one — the server has no notion of a tenant —
// so the only safe contract is one where the caller cannot express the
// question: a suffix plus the account the panel authorised can only ever
// produce that account's own name. Nothing has ever generated against the old
// reading; the field number, name and type are unchanged.
message DropDatabaseRequest {
  // System username of the owning account.
  string account_username = 1;
  // Database name suffix, as passed to CreateDatabase. The agent namespaces it
  // under account_username, so a suffix naming another tenant's database is
  // impossible rather than merely refused.
  string database_name = 2;
  // Added 2026-09-01. Username suffix of the dedicated user created alongside
  // the database, dropped with it. Required: the customer names the database
  // and its user independently (see CreateDatabaseRequest), so there is nothing
  // to derive one from the other with, and a drop that guessed would either
  // leave a live credential behind or remove somebody else's. An empty value is
  // refused as invalid input rather than treated as "drop the database only".
  string db_username = 3;
}

message DropDatabaseResponse {
  oneof result {
    DropDatabaseOk ok = 1;
    AgentError error = 2;
  }
}

message DropDatabaseOk {}

message ListDatabasesRequest {
  // System username of the owning account.
  string account_username = 1;
}

message ListDatabasesResponse {
  oneof result {
    ListDatabasesOk ok = 1;
    AgentError error = 2;
  }
}

message ListDatabasesOk {
  repeated DatabaseInfo databases = 1;
}

// One row of the DIAGNOSTIC listing: what this SERVER holds under a name that
// decodes to the account. It is not the panel's record of what the account
// owns, and it is not an authorisation answer — the server has no notion of a
// tenant, so a name only looks like it belongs to an account because of the
// prefix this panel put there. What a customer may see, drop or measure is
// decided by the panel's own rows.
//
// Reconciled 2026-09-01, additively: `db_username` and `size_bytes` gained
// explicit presence and the agent leaves BOTH UNSET. Absence is a real answer
// here, and the proto3 default is not:
//
// `db_username` is unset because the server records which users are GRANTED on
// a database, not which one was "its" user, and the customer names the two
// halves independently (see CreateDatabaseRequest). Filling it in means
// guessing — usually by assuming the user is named after the database — and a
// guess printed beside a real name reads as a fact. The panel HAS the true
// pairing in its own rows; the agent does not, and says so.
//
// `size_bytes` is unset because a size is one `information_schema` query per
// database, so filling it here turns an operator's overview into a full scan of
// the server's table metadata on a host with thousands of databases. A caller
// that wants a size asks GetDatabaseSize for the one it wants. Sending `0`
// would also be a claim — "this database is empty" — that the listing never
// measured, and a panel could not tell it from "not known".
//
// A future agent that can answer either honestly sets it; until then an
// unset field means "the agent did not establish this", which is the truth.
message DatabaseInfo {
  // Fully-qualified database name, as the server holds it. Always set: it is
  // the one thing the listing actually establishes.
  string database_name = 1;
  // Fully-qualified username of its dedicated user, when the sender knows it.
  // Left unset by the agent — see the note above.
  optional string db_username = 2;
  // Current on-disk size in bytes, when the sender has measured it. Left unset
  // by the agent — see the note above. Ask GetDatabaseSize for a real figure.
  optional uint64 size_bytes = 3;
}

message SetDatabasePasswordRequest {
  // System username of the owning account.
  string account_username = 1;
  // Username suffix of the dedicated database user, as passed to
  // CreateDatabase. Namespaced under account_username by the agent, so a
  // request cannot name another tenant's user — the same reason
  // DropDatabaseRequest takes a suffix rather than a fully-qualified name.
  string db_username = 2;
  // New plaintext password, supplied by the caller. There is no "leave
  // unchanged" here: setting a password is the whole rpc, and an empty value is
  // refused as invalid input rather than treated as a no-op. Never logged; not
  // echoed back in any response or error.
  string password = 3;
}

message SetDatabasePasswordResponse {
  oneof result {
    SetDatabasePasswordOk ok = 1;
    AgentError error = 2;
  }
}

message SetDatabasePasswordOk {}

message GetDatabaseSizeRequest {
  // System username of the owning account.
  string account_username = 1;
  // Database name suffix, as passed to CreateDatabase — corrected 2026-09-01
  // from "fully-qualified", for the reason DropDatabaseRequest gives. A size is
  // a smaller prize than a drop, but it is still an answer about another
  // tenant's data, so the boundary is one rule rather than one rule per rpc.
  string database_name = 2;
}

message GetDatabaseSizeResponse {
  oneof result {
    GetDatabaseSizeOk ok = 1;
    AgentError error = 2;
  }
}

message GetDatabaseSizeOk {
  // Current on-disk size in bytes.
  uint64 size_bytes = 1;
}

// Added 2026-09-13.
message RepairDatabaseGrantsRequest {
  // When true, nothing is changed: the agent classifies every row and reports
  // what it WOULD rewrite. Present because the operation revokes and re-issues
  // live database access, so an operator must be able to read the list before
  // it happens rather than trust the predicate. The proto3 default is false,
  // which means "do the repair" — the same thing an older caller that cannot
  // set the field asks for.
  bool report_only = 1;
}

// Added 2026-09-13.
message RepairDatabaseGrantsResponse {
  oneof result {
    RepairDatabaseGrantsOk ok = 1;
    AgentError error = 2;
  }
}

// Added 2026-09-13. An account of the WHOLE grant table: examined_grants equals
// already_correct plus the three repeated fields' lengths, so the report reads
// as a census rather than as a list of whatever was interesting.
message RepairDatabaseGrantsOk {
  // Rows of the server's database-level grant table that were read and
  // classified.
  uint32 examined_grants = 1;
  // Rows that already held the escaped form, or whose name cannot hold a
  // wildcard at all. Nothing was sent for these, and nothing is owed about
  // them: a clean install reports every row here.
  uint32 already_correct = 2;
  // Rows that were rewritten. Empty when report_only was set.
  repeated RepairedGrant repaired = 3;
  // Rows a report_only pass would have rewritten. Always empty otherwise.
  repeated RepairedGrant would_repair = 4;
  // Rows deliberately left alone, with the reason for each. An operator reads
  // this: "untouched" is meant to be observable rather than assumed.
  repeated RefusedGrant refused = 5;
}

// Added 2026-09-13. One grant whose stored pattern became a literal name.
message RepairedGrant {
  // Fully-qualified database name the grant was always meant to name.
  string database_name = 1;
  // Fully-qualified user the grant belongs to.
  string db_username = 2;
  // Other databases on this server that the OLD pattern also matched.
  //
  // The one piece of evidence this operation can produce, and it is evidence of
  // EXPOSURE and not of use: a name here is a database the repaired credential
  // could have read and written while the row stood. An empty list does not
  // clear the row — a matching database may have been created and dropped in
  // between, and a pattern is matched at connection time. Whether the reach was
  // USED is answered only by a query log, which is off on a default install.
  repeated string also_matched_databases = 3;
}

// Added 2026-09-13. One grant-table row the repair refused to touch.
//
// The three name fields are the server's raw columns, because a row lands here
// precisely because it is not a value this agent could have produced. They are
// for an operator to read; the agent never puts them back into a statement.
message RefusedGrant {
  // The Host column, as the server holds it.
  string grant_host = 1;
  // The Db column, as the server holds it — escapes included, so an operator
  // sees the stored pattern and not a tidied rendering of it.
  string database_name = 2;
  // The User column, as the server holds it.
  string db_username = 3;
  // Why the repair refused the row.
  GrantRepairRefusal reason = 4;
}

// Added 2026-09-13. Why a row was left exactly as it was found.
enum GrantRepairRefusal {
  // No reason given. Never sent by this agent; present because proto3 requires
  // a zero value, and a caller seeing it is reading a message from something
  // else.
  GRANT_REPAIR_REFUSAL_UNSPECIFIED = 0;
  // The grant is for a host other than 'localhost', which is the only host this
  // panel grants from. Reported rather than ignored: such a row carries the same
  // unescaped wildcard, reachable from further away, and only the operator knows
  // what depends on it.
  GRANT_REPAIR_REFUSAL_HOST_IS_NOT_LOCALHOST = 1;
  // The database and user names are not a pair this panel could have created —
  // one of them does not decode against a whole account name, or the two decode
  // to different accounts.
  GRANT_REPAIR_REFUSAL_NOT_THE_PANELS_NAMING = 2;
  // The row does not hold exactly the ALL PRIVILEGES grant this panel issues.
  // Re-granting over a narrower one would ESCALATE it, which is worse than the
  // wildcard being repaired.
  GRANT_REPAIR_REFUSAL_UNRECOGNISED_PRIVILEGES = 3;
  // The stored pattern is escaped in a form this panel never writes — in part,
  // twice, or escaping some other character. Re-escaping a form nobody
  // understands is how a working grant is destroyed.
  GRANT_REPAIR_REFUSAL_PARTIALLY_OR_UNFAMILIARLY_ESCAPED = 4;
}

// Added 2026-11-07 (issue #156). A privilege a customer's login may hold on one
// of the customer's own databases. The set is closed ON PURPOSE: GRANT OPTION,
// FILE, PROCESS, SUPER, RELOAD, SHUTDOWN, REPLICATION and every global
// privilege have no value here, so no request can name them and no statement
// the agent builds can grant them. A value of this enum is a database-level
// privilege and nothing wider.
enum DatabasePrivilege {
  // No privilege given. Never sent by the panel; a request carrying it is
  // refused as invalid input rather than ignored.
  DATABASE_PRIVILEGE_UNSPECIFIED = 0;
  // SELECT.
  DATABASE_PRIVILEGE_SELECT = 1;
  // INSERT.
  DATABASE_PRIVILEGE_INSERT = 2;
  // UPDATE.
  DATABASE_PRIVILEGE_UPDATE = 3;
  // DELETE.
  DATABASE_PRIVILEGE_DELETE = 4;
  // CREATE.
  DATABASE_PRIVILEGE_CREATE = 5;
  // DROP.
  DATABASE_PRIVILEGE_DROP = 6;
  // ALTER.
  DATABASE_PRIVILEGE_ALTER = 7;
  // INDEX.
  DATABASE_PRIVILEGE_INDEX = 8;
  // REFERENCES.
  DATABASE_PRIVILEGE_REFERENCES = 9;
  // CREATE TEMPORARY TABLES.
  DATABASE_PRIVILEGE_CREATE_TEMPORARY_TABLES = 10;
  // LOCK TABLES.
  DATABASE_PRIVILEGE_LOCK_TABLES = 11;
  // CREATE VIEW.
  DATABASE_PRIVILEGE_CREATE_VIEW = 12;
  // SHOW VIEW.
  DATABASE_PRIVILEGE_SHOW_VIEW = 13;
  // CREATE ROUTINE.
  DATABASE_PRIVILEGE_CREATE_ROUTINE = 14;
  // ALTER ROUTINE.
  DATABASE_PRIVILEGE_ALTER_ROUTINE = 15;
  // EXECUTE.
  DATABASE_PRIVILEGE_EXECUTE = 16;
  // TRIGGER.
  DATABASE_PRIVILEGE_TRIGGER = 17;
  // EVENT.
  DATABASE_PRIVILEGE_EVENT = 18;
}

// Added 2026-11-07.
message CreateDatabaseUserRequest {
  // System username of the owning account.
  string account_username = 1;
  // Username suffix of the new login. The agent namespaces it under
  // account_username, so a request cannot name another tenant's login.
  string db_username = 2;
  // Plaintext password for the new login, supplied by the caller. Never logged;
  // not echoed back in any response or error.
  string password = 3;
}

// Added 2026-11-07.
message CreateDatabaseUserResponse {
  oneof result {
    CreateDatabaseUserOk ok = 1;
    AgentError error = 2;
  }
}

// Added 2026-11-07.
message CreateDatabaseUserOk {
  // Fully-qualified login name as created, e.g. "acc12345_reader".
  string db_username = 1;
}

// Added 2026-11-07.
message DropDatabaseUserRequest {
  // System username of the owning account.
  string account_username = 1;
  // Username suffix of the login to drop, namespaced under account_username by
  // the agent for the reason SetDatabasePasswordRequest gives.
  string db_username = 2;
}

// Added 2026-11-07.
message DropDatabaseUserResponse {
  oneof result {
    DropDatabaseUserOk ok = 1;
    AgentError error = 2;
  }
}

// Added 2026-11-07.
message DropDatabaseUserOk {}

// Added 2026-11-07.
message SetDatabaseUserPrivilegesRequest {
  // System username of the owning account.
  string account_username = 1;
  // Username suffix of the login, namespaced under account_username by the
  // agent.
  string db_username = 2;
  // Database name suffix, as passed to CreateDatabase; namespaced under
  // account_username by the agent, so a request cannot name another tenant's
  // database.
  string database_name = 3;
  // The complete set the login is to hold on that database. Empty revokes all
  // of it. Each value must be a defined, non-zero DatabasePrivilege and may
  // appear once: a duplicate, an unspecified value or a number the contract
  // does not define is refused as invalid input, never ignored.
  repeated DatabasePrivilege privileges = 4;
}

// Added 2026-11-07.
message SetDatabaseUserPrivilegesResponse {
  oneof result {
    SetDatabaseUserPrivilegesOk ok = 1;
    AgentError error = 2;
  }
}

// Added 2026-11-07.
message SetDatabaseUserPrivilegesOk {}
