// TLS certificate placement for sites. ACME (ordering/DNS-01/HTTP-01)
// happens in the backend; the agent only writes certificate material to
// disk, wires it into the site's vhost, and reloads the web server.
syntax = "proto3";

package maran.agent.v1;

option csharp_namespace = "Maran.Agent.V1";

import "agent/v1/common.proto";
import "agent/v1/sites.proto";

service SslService {
  // Installs a certificate/key pair for a domain: writes both files under
  // the agent's own cert store (never inside the account's home), updates
  // the site's vhost to reference them, validates, and reloads. Idempotent:
  // installing byte-identical material again is a no-op success;
  // installing different material for the same domain replaces it.
  rpc InstallCertificate(InstallCertificateRequest) returns (InstallCertificateResponse);

  // Removes a domain's certificate files and reverts its vhost to plain
  // HTTP, then reloads. Idempotent: removing when no certificate is
  // installed returns NotFound.
  //
  // Plain HTTP and not a self-signed fallback, deliberately. A fallback
  // keeps 443 answering and gives every visitor a full-page interstitial —
  // and where the real certificate had set HSTS, no click-through at all.
  // That turns "HTTPS is off" into "this site is warning you it may be
  // attacked", for a certificate the operator chose to remove. A caller that
  // wants 443 to keep answering calls GenerateSelfSigned afterwards: the
  // fallback is a separately-callable state, and folding it in here would
  // put key generation on the failure path of a delete.
  rpc RemoveCertificate(RemoveCertificateRequest) returns (RemoveCertificateResponse);

  // Generates and installs a self-signed certificate for a domain, for use
  // before a real certificate is available. Idempotent: regenerating
  // replaces a placeholder this panel itself wrote — recognised by the
  // OU=maran-self-signed marker in its subject — and never overwrites any
  // other certificate (returns ALREADY_EXISTS instead). That includes a
  // self-signed certificate the customer installed themselves: self-signed
  // alone does not mean "ours", and overwriting theirs would destroy their
  // key with no warning. A caller that means to replace calls
  // InstallCertificate.
  rpc GenerateSelfSigned(GenerateSelfSignedRequest) returns (GenerateSelfSignedResponse);

  // Added 2026-11-01 (issue #132). Replaces the panel's OWN certificate and
  // key — the pair the panel's nginx vhost names, /etc/maran/tls/panel.crt and
  // panel.key — validates with nginx -t and reloads, restoring the previous
  // pair on any refusal. The key is checked against the certificate before
  // anything is written. No vhost is rewritten: the installer rendered the
  // panel vhost against these two fixed names. Idempotent: byte-identical
  // material already in place is a no-op success.
  rpc InstallPanelCertificate(InstallPanelCertificateRequest) returns (InstallPanelCertificateResponse);

  // Added 2026-11-01 (issue #132). Writes the HTTP-01 challenge file for the
  // panel's own host name into the agent-owned directory the panel's port-80
  // block serves /.well-known/acme-challenge/ from. Refused below the agent's
  // free-space floor with ERROR_CODE_BELOW_FREE_SPACE_FLOOR before anything is
  // written, as WriteFile refuses a customer's challenge. Idempotent: writing
  // the same token again replaces the file.
  rpc WritePanelChallenge(WritePanelChallengeRequest) returns (WritePanelChallengeResponse);

  // Added 2026-11-01 (issue #132). Removes the panel's challenge file for a
  // token. Idempotent: a token with no file answers NotFound.
  rpc RemovePanelChallenge(RemovePanelChallengeRequest) returns (RemovePanelChallengeResponse);
}

message InstallCertificateRequest {
  // System username of the owning account.
  string account_username = 1;
  // Domain the certificate is installed for; must match the site's domain
  // or one of its aliases.
  string domain = 2;
  // PEM-encoded leaf certificate, optionally followed by the chain.
  string certificate_pem = 3;
  // PEM-encoded private key, matching certificate_pem. Never logged or
  // echoed back in error output.
  string private_key_pem = 4;
  // What the site is, so the TLS vhost this writes is byte-identical to the
  // one CreateSite would have written for a site that already had a
  // certificate. Added 2026-08-31; required — see SiteSpec in sites.proto for
  // why a newly-required field was acceptable on these rpcs and would not be
  // on a live one.
  SiteSpec site = 5;
}

message InstallCertificateResponse {
  oneof result {
    InstallCertificateOk ok = 1;
    // Every failure that is not a verdict on the material itself: no such
    // site, a refused vhost, a fault of this machine.
    AgentError error = 2;
    // Added 2026-10-30. The material the caller sent was read and refused,
    // and nothing was written. Its own case rather than an AgentError with
    // ERROR_CODE_INVALID_INPUT, because the caller has to say WHICH half is
    // wrong, and the three answers below are three different things to fix.
    InstallCertificateRefused refused = 3;
  }
}

// Added 2026-10-30. Why the supplied material was refused before anything
// was written.
message InstallCertificateRefused {
  // Which half of the pair is wrong, or that the two do not belong together.
  CertificateMaterialRefusal reason = 1;
}

// Added 2026-10-30. What was wrong with certificate material a caller sent.
enum CertificateMaterialRefusal {
  // No reason given. Never sent by this agent; present because proto3
  // requires a zero value, and a caller seeing it is reading a message from
  // something else.
  CERTIFICATE_MATERIAL_REFUSAL_UNSPECIFIED = 0;
  // openssl could not read certificate_pem as an X.509 certificate.
  CERTIFICATE_MATERIAL_REFUSAL_MALFORMED_CERTIFICATE = 1;
  // openssl could not read private_key_pem as a private key.
  CERTIFICATE_MATERIAL_REFUSAL_MALFORMED_PRIVATE_KEY = 2;
  // Both halves are readable, and the key is not the certificate's key.
  CERTIFICATE_MATERIAL_REFUSAL_KEY_DOES_NOT_MATCH_CERTIFICATE = 3;
}

message InstallCertificateOk {
  // Certificate expiry as Unix seconds (UTC), parsed from the installed
  // certificate, for the caller to schedule renewal reminders.
  int64 expires_at_unix = 1;
}

message RemoveCertificateRequest {
  // System username of the owning account.
  string account_username = 1;
  // Domain whose certificate is removed.
  string domain = 2;
  // What the site is, so the plain-HTTP vhost it reverts to is the site's
  // own. Added 2026-08-31; required.
  SiteSpec site = 3;
}

message RemoveCertificateResponse {
  oneof result {
    RemoveCertificateOk ok = 1;
    AgentError error = 2;
  }
}

message RemoveCertificateOk {}

message GenerateSelfSignedRequest {
  // System username of the owning account.
  string account_username = 1;
  // Domain the self-signed certificate is generated for. The placeholder
  // also covers the aliases in `site`.
  string domain = 2;
  // What the site is. Added 2026-08-31; required.
  SiteSpec site = 3;
}

message GenerateSelfSignedResponse {
  oneof result {
    GenerateSelfSignedOk ok = 1;
    AgentError error = 2;
  }
}

message GenerateSelfSignedOk {
  // Certificate expiry as Unix seconds (UTC).
  int64 expires_at_unix = 1;
}

// Added 2026-11-01 (issue #132). The panel's own certificate material.
message InstallPanelCertificateRequest {
  // PEM-encoded leaf certificate, optionally followed by the chain.
  string certificate_pem = 1;
  // PEM-encoded private key, matching certificate_pem. Never logged or
  // echoed back in error output.
  string private_key_pem = 2;
}

message InstallPanelCertificateResponse {
  oneof result {
    InstallPanelCertificateOk ok = 1;
    // Every failure that is not a verdict on the material itself.
    AgentError error = 2;
    // The material was read and refused, and nothing was written — the same
    // three answers InstallCertificate gives.
    InstallCertificateRefused refused = 3;
  }
}

message InstallPanelCertificateOk {
  // Certificate expiry as Unix seconds (UTC), parsed from the installed
  // certificate, for the panel to schedule renewal from.
  int64 expires_at_unix = 1;
}

// Added 2026-11-01 (issue #132). One challenge file for the panel's host name.
message WritePanelChallengeRequest {
  // The challenge token from the certificate authority, which is also the
  // file's name. base64url, 1 to 128 characters; anything else is refused
  // with ERROR_CODE_INVALID_INPUT.
  string token = 1;
  // The file's content: the token, one dot, and the base64url thumbprint of
  // the panel's ACME account key (RFC 8555 §8.1), at most 256 characters.
  string key_authorization = 2;
}

message WritePanelChallengeResponse {
  oneof result {
    WritePanelChallengeOk ok = 1;
    AgentError error = 2;
  }
}

message WritePanelChallengeOk {}

// Added 2026-11-01 (issue #132). The token whose challenge file is removed.
message RemovePanelChallengeRequest {
  // The challenge token, held to the same grammar as in
  // WritePanelChallengeRequest.
  string token = 1;
}

message RemovePanelChallengeResponse {
  oneof result {
    RemovePanelChallengeOk ok = 1;
    AgentError error = 2;
  }
}

message RemovePanelChallengeOk {}
