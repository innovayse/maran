// Scheduled tasks (crontab) owned by a hosting account. These entries are
// written to the account's own user crontab and later executed by the
// system cron daemon under that account's own uid — the same privilege
// the account already has via SFTP/SSH. The agent itself never executes
// the command; it only renders and installs the crontab file, so this is
// not a bypass of the "no caller-supplied program execution" rule.
syntax = "proto3";

package maran.agent.v1;

option csharp_namespace = "Maran.Agent.V1";

import "agent/v1/common.proto";

service CronService {
  // Lists all cron entries currently installed for an account.
  rpc ListCronEntries(ListCronEntriesRequest) returns (ListCronEntriesResponse);

  // Appends a new cron entry to an account's crontab. Idempotent: creating
  // an entry with identical schedule and command to an existing one
  // returns AlreadyExists rather than duplicating it.
  rpc CreateCronEntry(CreateCronEntryRequest) returns (CreateCronEntryResponse);

  // Replaces the schedule and/or command of an existing cron entry,
  // identified by entry_id. Idempotent: applying the same values twice is
  // a no-op success.
  rpc UpdateCronEntry(UpdateCronEntryRequest) returns (UpdateCronEntryResponse);

  // Removes a cron entry from an account's crontab. Idempotent: deleting a
  // non-existent entry_id returns NotFound.
  rpc DeleteCronEntry(DeleteCronEntryRequest) returns (DeleteCronEntryResponse);

  // Enables or disables an existing entry without changing its schedule or
  // its command. Its own rpc rather than a field on UpdateCronEntry, because
  // the two are different operations: an update rewrites what runs, and this
  // one only decides whether it runs at all. Idempotent: setting the state an
  // entry already has is a no-op success.
  rpc SetCronEntryEnabled(SetCronEntryEnabledRequest) returns (SetCronEntryEnabledResponse);

  // Reads what an entry's most recent run left behind: the tail of its
  // output, its exit status, and when it finished. Read-only.
  rpc GetCronEntryOutput(GetCronEntryOutputRequest) returns (GetCronEntryOutputResponse);

  // Reads the environment assignments the agent manages in the account's
  // crontab. Read-only.
  rpc GetCronEnvironment(GetCronEnvironmentRequest) returns (GetCronEnvironmentResponse);

  // Replaces the agent-managed environment assignments, whole. Idempotent:
  // sending the same set twice converges on the same crontab.
  rpc SetCronEnvironment(SetCronEnvironmentRequest) returns (SetCronEnvironmentResponse);
}

// Standard five-field cron schedule. Each field uses conventional cron
// syntax (digits, "*", "*/n", ranges, lists) and is validated by the agent
// against that syntax before being written to the crontab file.
message CronSchedule {
  // Minute field, 0-59 or "*".
  string minute = 1;
  // Hour field, 0-23 or "*".
  string hour = 2;
  // Day-of-month field, 1-31 or "*".
  string day_of_month = 3;
  // Month field, 1-12 or "*".
  string month = 4;
  // Day-of-week field, 0-6 (0=Sunday) or "*".
  string day_of_week = 5;
}

message CronEntry {
  // Agent-assigned stable identifier for this entry, stable across list
  // calls, used to target update/delete.
  string entry_id = 1;
  // Schedule this entry runs on.
  CronSchedule schedule = 2;
  // Command line to execute, exactly as the account owner wrote it. Runs
  // under the account's own uid via the system cron daemon — the agent
  // does not parse or execute it, only stores it. This grants no privilege
  // the account does not already have over SFTP/SSH.
  //
  // The command is NOT written into the crontab. It is written verbatim to a
  // per-entry file under the account's home, and the installed crontab line
  // names that file; every byte of that line is agent-derived. Two earlier
  // designs put the command on the line and both were disproved on a real
  // host — cron rewrites the first unescaped `%` into a newline, and a `#`
  // starts a comment — so `%` and `#` are ORDINARY characters here and are
  // accepted.
  //
  // What the agent still rejects, with ERROR_CODE_INVALID_INPUT, is anything
  // that would stop the value being one line: a newline, a carriage return, a
  // NUL, any other control character, and a value over 4096 bytes. A command
  // file holds one command line, not a script.
  string command = 3;
  // True if the entry is installed and active; false entries are kept in
  // the crontab commented out (enable/disable without losing history).
  bool enabled = 4;
  // DEPRECATED in this message and always written 0 — a listing does not read
  // it. Reading an entry's exit status means reading a file under the
  // account's home per entry, which would turn one listing into N privileged
  // reads. Ask GetCronEntryOutput for the entry you are showing. A 0 here is
  // "not read", never "the last run succeeded"; the field is kept rather than
  // removed because removing it is a breaking change (rules/proto.md).
  int32 last_exit_code = 5;
  // DEPRECATED in this message and always written 0, for the same reason as
  // last_exit_code. GetCronEntryOutput answers it per entry.
  int64 last_run_at_unix = 6;
}

// One environment assignment the agent manages in an account's crontab.
message CronEnvironmentVariable {
  // The variable's name: letters, digits and underscores, not starting with a
  // digit. MAILTO and SHELL are refused with ERROR_CODE_INVALID_INPUT —
  // MAILTO is an outbound-relay primitive through the host's mail transfer
  // agent, and SHELL changes the interpreter under every managed entry. The
  // agent emits both itself, with values of its own choosing.
  string name = 1;
  // The value, written verbatim. Rejected for a newline, a carriage return, a
  // NUL or any other control character, because a crontab is line-oriented.
  string value = 2;
}

message ListCronEntriesRequest {
  // System username of the owning account.
  string account_username = 1;
}

message ListCronEntriesResponse {
  oneof result {
    ListCronEntriesOk ok = 1;
    AgentError error = 2;
  }
}

message ListCronEntriesOk {
  repeated CronEntry entries = 1;
}

message CreateCronEntryRequest {
  // System username of the owning account.
  string account_username = 1;
  // Schedule for the new entry.
  CronSchedule schedule = 2;
  // Command line to install, verbatim. Same validation as
  // CronEntry.command: `%` and `#` are ordinary characters, control
  // characters and anything over 4096 bytes are refused.
  string command = 3;
}

message CreateCronEntryResponse {
  oneof result {
    CreateCronEntryOk ok = 1;
    AgentError error = 2;
  }
}

message CreateCronEntryOk {
  // Agent-assigned identifier of the created entry.
  string entry_id = 1;
}

message UpdateCronEntryRequest {
  // System username of the owning account.
  string account_username = 1;
  // Identifier of the entry to update.
  string entry_id = 2;
  // New schedule.
  CronSchedule schedule = 3;
  // New command line, verbatim.
  string command = 4;
  // DEPRECATED and never read — an update rewrites what an entry runs and
  // leaves its enablement exactly as it was. Call SetCronEntryEnabled to
  // change that. Reading it here would make "update the command" silently
  // re-enable an entry the operator had switched off, because proto3's
  // default for a boolean the caller did not set is false. The field is kept
  // rather than removed because removing it is a breaking change
  // (rules/proto.md).
  bool enabled = 5;
}

message UpdateCronEntryResponse {
  oneof result {
    UpdateCronEntryOk ok = 1;
    AgentError error = 2;
  }
}

message UpdateCronEntryOk {}

message DeleteCronEntryRequest {
  // System username of the owning account.
  string account_username = 1;
  // Identifier of the entry to delete.
  string entry_id = 2;
}

message DeleteCronEntryResponse {
  oneof result {
    DeleteCronEntryOk ok = 1;
    AgentError error = 2;
  }
}

message DeleteCronEntryOk {}

message SetCronEntryEnabledRequest {
  // System username of the owning account.
  string account_username = 1;
  // Identifier of the entry to enable or disable.
  string entry_id = 2;
  // True installs the entry as a live crontab line; false keeps it in the
  // crontab commented out, so disabling never loses the entry.
  bool enabled = 3;
}

message SetCronEntryEnabledResponse {
  oneof result {
    SetCronEntryEnabledOk ok = 1;
    AgentError error = 2;
  }
}

message SetCronEntryEnabledOk {}

message GetCronEntryOutputRequest {
  // System username of the owning account.
  string account_username = 1;
  // Identifier of the entry to read.
  string entry_id = 2;
}

message GetCronEntryOutputResponse {
  oneof result {
    GetCronEntryOutputOk ok = 1;
    AgentError error = 2;
  }
}

message GetCronEntryOutputOk {
  // The TAIL of the entry's output, bounded by the agent, decoded lossily —
  // the bytes are whatever the customer's command wrote, and one invalid
  // sequence must not make the rest unreadable.
  //
  // ABSENT means the entry has never run: there is no output file at all. An
  // empty string is the different answer — it ran and said nothing.
  //
  // The file belongs to the account and the account can write it, so this is
  // what the account's own runs left behind. It is informational, not
  // authoritative: never treat it as evidence of what the agent did.
  optional string output = 1;
  // Exit status of the most recent run.
  //
  // ABSENT when the entry has never run, or ran and left no readable status.
  // Explicit presence rather than a sentinel, because 0 is the status of a
  // successful run and would otherwise also have to mean "never ran".
  optional int32 last_exit_code = 2;
  // When the most recent run finished, Unix seconds (UTC). Taken from the
  // modification time of the file the run's status was written to, so it is
  // the time the RUN ended rather than a clock reading taken by this call.
  //
  // ABSENT when the entry has never run. Account-writable, like `output`.
  optional int64 last_run_at_unix = 3;
}

message GetCronEnvironmentRequest {
  // System username of the owning account.
  string account_username = 1;
}

message GetCronEnvironmentResponse {
  oneof result {
    GetCronEnvironmentOk ok = 1;
    AgentError error = 2;
  }
}

message GetCronEnvironmentOk {
  // The agent-managed assignments, in the order the crontab holds them.
  // Assignments written by the account or the host outside the agent's own
  // region are not reported and are never rewritten.
  repeated CronEnvironmentVariable variables = 1;
}

message SetCronEnvironmentRequest {
  // System username of the owning account.
  string account_username = 1;
  // The complete new set. It REPLACES the agent-managed assignments whole:
  // a name absent from this list is removed. Sending an empty list is
  // therefore how every managed assignment is cleared, and is not an error.
  repeated CronEnvironmentVariable variables = 2;
}

message SetCronEnvironmentResponse {
  oneof result {
    SetCronEnvironmentOk ok = 1;
    AgentError error = 2;
  }
}

message SetCronEnvironmentOk {}
