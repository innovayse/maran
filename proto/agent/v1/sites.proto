// Site (vhost) lifecycle: document root, backend type, PHP version, logs.
syntax = "proto3";

package maran.agent.v1;

option csharp_namespace = "Maran.Agent.V1";

import "agent/v1/common.proto";
import "agent/v1/php.proto";

// Manages web-server sites owned by an account. A site is a domain served
// from a document root under the account's home; the agent renders its
// own vhost include, validates it, and reloads the web server — it never
// accepts a config fragment or template from the caller.
service SitesService {
  // Creates a site: allocates the document root under the account's home
  // (creating it if absent), renders and validates a vhost include for the
  // requested backend, and reloads the web server. A site already existing
  // for the same account+domain returns ALREADY_EXISTS, and so does a request
  // whose domain or alias another vhost already serves (the document root,
  // log directory and PHP pool may remain). A request that repeats a name
  // returns INVALID_INPUT.
  rpc CreateSite(CreateSiteRequest) returns (CreateSiteResponse);

  // Switches a PHP-backed site to a different installed PHP version and
  // reloads its PHP-FPM pool. Idempotent: setting the version the site
  // already has CONVERGES it instead of returning early - the pool and the
  // vhost are rendered and compared with the files on disk, and only a file
  // that differs is rewritten (pool first, vhost unless the site is
  // suspended). A site that is already current is a success that writes and
  // reloads nothing; a site written by an earlier release (a socket path this
  // release no longer uses) is brought to the current one by the same call.
  // Fails VALIDATION_FAILED if the version is not installed on this host.
  rpc UpdateSitePhpVersion(UpdateSitePhpVersionRequest) returns (UpdateSitePhpVersionResponse);

  // Enables a previously disabled site (restores normal serving).
  // Idempotent: enabling an already-enabled site is a no-op success.
  rpc EnableSite(EnableSiteRequest) returns (EnableSiteResponse);

  // Disables a site: the vhost is kept (so SSL renewal and SEO are not
  // disrupted) but serves a suspension response instead of the site
  // content. Idempotent: disabling an already-disabled site is a no-op
  // success.
  rpc DisableSite(DisableSiteRequest) returns (DisableSiteResponse);

  // Removes a site's vhost include and reloads the web server. The
  // document root and its files are NOT deleted by this call — file
  // removal is a separate, explicitly audited FilesService operation.
  // Idempotent: deleting a non-existent site returns NotFound.
  rpc DeleteSite(DeleteSiteRequest) returns (DeleteSiteResponse);

  // Streams the tail of a site's access or error log, most recent lines
  // first batch, then follows new lines as they are written until the
  // caller cancels the stream or line_limit historical lines plus live
  // tailing have been sent. Read-only; safe to call repeatedly.
  rpc TailSiteLog(TailSiteLogRequest) returns (stream TailSiteLogResponse);

  // Reads a site's access log from a cursor onward and returns what it holds as
  // per-UTC-day counters: requests, body bytes, status codes and the most
  // requested paths. Read-only; no visitor address, query string or user agent
  // leaves the agent. Reads the live file and the previous rotation (".1") only,
  // at most 64 MiB per call, so a busy site is caught up over several calls
  // (caught_up false). Concurrent calls are bounded: a call beyond the host's
  // small ceiling is refused SYSTEM_FAILURE and is safe to repeat later.
  // Cancellation class: stop - the read is bounded by its byte budget and ends
  // on its own if the caller goes away.
  rpc SummariseSiteTraffic(SummariseSiteTrafficRequest) returns (SummariseSiteTrafficResponse);

  // Removes a site's rotated log archives numbered above retain_rotations
  // (access and error, compressed or not). Never touches the live log or any
  // file that is not exactly `<domain>.<access|error>.log.<N>[.gz]` with N above
  // the retained count. Idempotent: repeating it removes nothing more.
  // Cancellation class: run to completion - deleting has no unsafe midpoint.
  rpc PruneSiteLogs(PruneSiteLogsRequest) returns (PruneSiteLogsResponse);

  // Validates the current web-server configuration and reloads it.
  // Used after a batch of site changes to apply them in one reload instead
  // of one per change. Idempotent: reloading with no pending changes is a
  // no-op success. On validation failure, the previous running config is
  // left untouched and the failing tool output is returned.
  rpc ReloadWebServer(ReloadWebServerRequest) returns (ReloadWebServerResponse);
}

// Backend that serves the site's content.
enum SiteBackendType {
  SITE_BACKEND_TYPE_UNSPECIFIED = 0;
  // Static files only, no application server.
  SITE_BACKEND_TYPE_STATIC = 1;
  // PHP-FPM pool bound to php_version.
  SITE_BACKEND_TYPE_PHP = 2;
  // Reverse-proxied to an upstream the caller names explicitly.
  SITE_BACKEND_TYPE_REVERSE_PROXY = 3;
  // A Node.js application the agent runs under a per-site systemd unit, owned
  // by the site's account, and reverse-proxies to app_port on the loopback
  // address. Needs node_version, app_port and start_command. Added 2026-11-10
  // (issue #517).
  SITE_BACKEND_TYPE_NODE = 4;
}

// The web server that owns ports 80 and 443 for hosted sites, chosen once at
// first-run setup through the app store (issue #517, docs/apps/README.md).
// The panel's own front on port 8443 is nginx whichever value is chosen.
// Added 2026-11-10.
enum SiteWebServer {
  // Not set. A caller that predates this enum sends it, and the agent reads it
  // as SITE_WEB_SERVER_NGINX: before the choice existed nginx served every
  // site, so the zero value is the old behaviour and not a guess.
  SITE_WEB_SERVER_UNSPECIFIED = 0;
  // nginx serves the site.
  SITE_WEB_SERVER_NGINX = 1;
  // Apache serves the site.
  SITE_WEB_SERVER_APACHE = 2;
}

// The panel's record of what a site IS, as opposed to which site it is.
//
// Added 2026-08-31. **Additive by the letter of rules/proto.md, and a
// SEMANTIC break by its spirit, taken deliberately.** The field is new and no
// number is reused, so an old caller still compiles and still sends valid
// messages — but the rpcs below now REFUSE a message that omits it, so an old
// caller stops working. That was judged acceptable exactly once, here, because
// these rpcs have no caller yet: nothing has shipped that could be broken. It
// is recorded rather than left to be inferred, and a later change of this shape
// on a live rpc is a v2, not a field. Every operation that re-renders a vhost —
// enabling, disabling, switching PHP version, installing or removing a
// certificate — must produce the SAME text CreateSite produced, and that text
// is a function of the backend, the aliases and whether a certificate is
// installed. Those facts live in the panel's database, which is where a site
// is created, renamed and re-planned; the vhost on disk is a rendering of
// them, not a second copy to be read back. A caller that omits this message
// gets INVALID_INPUT rather than a static-backend vhost silently replacing a
// PHP one: proto3 cannot distinguish "absent" from "static", so the agent
// refuses the default instead of acting on it.
message SiteSpec {
  // Additional hostnames served by the same site, as in CreateSiteRequest.
  repeated string aliases = 1;
  // Which backend serves this site's content. SITE_BACKEND_TYPE_UNSPECIFIED
  // is refused.
  SiteBackendType backend_type = 2;
  // Required when backend_type is PHP: the version the site is bound to.
  string php_version = 3;
  // Required when backend_type is REVERSE_PROXY: the upstream to forward to.
  string proxy_upstream = 4;
  // True when a TLS certificate is currently installed for the domain, so the
  // re-rendered vhost keeps its redirect and its TLS block. False renders
  // plain HTTP. The caller knows this and the renderer must not guess: a
  // guess drops a live site back to port 80 on the next unrelated edit.
  bool has_certificate = 5;
  // The customer's per-site options (redirects, basic auth, IP rules, request
  // limit, upload size, cache headers). Panel-owned like every other field here: the panel
  // stores them and sends them on EVERY re-render, because a vhost rendered
  // without them silently drops a site's redirects, credentials and IP rules.
  // Every field of SiteOptions has a zero value meaning "absent", so a caller
  // that predates this field renders exactly the vhost it rendered before.
  // Added 2026-11-07.
  SiteOptions options = 6;
  // Which web server renders the vhost; UNSPECIFIED means nginx. Panel-owned
  // like every other field here, and sent on every re-render so the vhost a
  // site was created with is the vhost it keeps. Added 2026-11-10.
  SiteWebServer web_server = 7;
  // Required when backend_type is NODE: the Node.js major version the site is
  // bound to, e.g. "20". Added 2026-11-10.
  string node_version = 8;
  // Required when backend_type is NODE: the loopback port the application
  // listens on, 1024 to 65535. Added 2026-11-10.
  uint32 app_port = 9;
  // Required when backend_type is NODE: the command the site's unit runs from
  // the document root, e.g. "node server.js". Re-validated by the agent
  // against its own shape rules and never handed to a shell. Added 2026-11-10.
  string start_command = 10;
}

message CreateSiteRequest {
  // System username of the owning account.
  string account_username = 1;
  // Primary domain served by the site, e.g. "example.com". Validated as a
  // syntactically well-formed hostname.
  string domain = 2;
  // Additional hostnames (e.g. "www.example.com") served by the same site.
  repeated string aliases = 3;
  // Which backend serves this site's content.
  SiteBackendType backend_type = 4;
  // Required when backend_type is PHP: installed PHP version to bind to,
  // e.g. "8.3".
  string php_version = 5;
  // Required when backend_type is REVERSE_PROXY: the upstream to forward
  // to, e.g. "127.0.0.1:3000". Host must be an IPv4 loopback or IPv4 private
  // address, or an IPv6 loopback; IPv6 unique-local (fc00::/7) is NOT accepted,
  // because a customer-supplied upstream fails closed and nothing on a supported
  // host needs it. Validated by the agent, not passed through to the config
  // verbatim.
  string proxy_upstream = 6;
  // The account plan's worker budget, materialised into the pm.max_children
  // of the pool this site's vhost points at (spec §8). Panel-owned: it comes
  // from the plan, not from anything the agent can read back off this host.
  // Ignored for a site that is not PHP-backed, which owns no pool.
  // Added 2026-09-01.
  uint32 max_children = 7;
  // The customer's php.ini overrides, re-validated by the agent against its
  // own whitelist. Panel-owned for the same reason as max_children, and
  // carried here for the same reason UpdateSitePhpVersion carries it: a pool
  // belongs to an ACCOUNT and a version, not to one site, so creating a second
  // site on a version the account already uses rewrites that pool — and a
  // rewrite that omitted the settings would silently drop them.
  // Added 2026-09-01.
  repeated PhpSetting overrides = 8;
  // The site's per-site options, as in SiteSpec. Absent = none.
  // Added 2026-11-07.
  SiteOptions options = 9;
  // Which web server renders the vhost; UNSPECIFIED means nginx. Added
  // 2026-11-10 (issue #517).
  SiteWebServer web_server = 10;
  // Required when backend_type is NODE: the Node.js major version to bind to,
  // e.g. "20". Added 2026-11-10.
  string node_version = 11;
  // Required when backend_type is NODE: the loopback port the application
  // listens on, 1024 to 65535. Added 2026-11-10.
  uint32 app_port = 12;
  // Required when backend_type is NODE: the command the site's unit runs from
  // the document root, e.g. "node server.js". Re-validated by the agent and
  // never handed to a shell. Added 2026-11-10.
  string start_command = 13;
}

message CreateSiteResponse {
  oneof result {
    CreateSiteOk ok = 1;
    AgentError error = 2;
  }
}

message CreateSiteOk {
  // Absolute document root, e.g. "/home/acc12345/sites/example.com".
  string document_root = 1;
}

message UpdateSitePhpVersionRequest {
  // System username of the owning account.
  string account_username = 1;
  // Primary domain of the site to update.
  string domain = 2;
  // Installed PHP version to switch to, e.g. "8.4".
  string php_version = 3;
  // What the site is, so its vhost re-renders to the same text CreateSite
  // wrote. Added 2026-08-31; required.
  SiteSpec site = 4;
  // The account plan's worker budget, materialised into the pool's
  // pm.max_children (spec §8). Panel-owned: it comes from the plan, not from
  // anything the agent can read back off this host.
  uint32 max_children = 5;
  // The customer's php.ini overrides, re-validated by the agent against its
  // own whitelist. Panel-owned for the same reason as max_children.
  repeated PhpSetting overrides = 6;
  // True when the panel has established that NO OTHER site of this account
  // still uses the version being left behind, in which case the agent removes
  // that version's pool once the site is serving from the new one.
  //
  // Panel-owned for the same reason retired_php_version is on DeleteSite: a
  // pool is shared per account x version, so removing it because THIS site
  // moved would take the account's other sites off the air. False leaves the
  // old pool in place, which is safe and merely wasteful.
  //
  // Added 2026-09-01.
  bool remove_previous_pool = 7;
}

message UpdateSitePhpVersionResponse {
  oneof result {
    UpdateSitePhpVersionOk ok = 1;
    AgentError error = 2;
  }
}

message UpdateSitePhpVersionOk {}

message EnableSiteRequest {
  // System username of the owning account.
  string account_username = 1;
  // Primary domain of the site to enable.
  string domain = 2;
  // What the site is, so the restored vhost is the site's own again. Added
  // 2026-08-31; required.
  SiteSpec site = 3;
}

message EnableSiteResponse {
  oneof result {
    EnableSiteOk ok = 1;
    AgentError error = 2;
  }
}

message EnableSiteOk {}

message DisableSiteRequest {
  // System username of the owning account.
  string account_username = 1;
  // Primary domain of the site to disable.
  string domain = 2;
  // What the site is. The suspended vhost keeps the site's own aliases and
  // log paths, so it is rendered from the same facts. Added 2026-08-31;
  // required.
  SiteSpec site = 3;
}

message DisableSiteResponse {
  oneof result {
    DisableSiteOk ok = 1;
    AgentError error = 2;
  }
}

message DisableSiteOk {}

message DeleteSiteRequest {
  // System username of the owning account.
  string account_username = 1;
  // Primary domain of the site to delete.
  string domain = 2;
  // The PHP version whose pool this site was served by, when the panel has
  // established that NO OTHER site of this account still uses that version --
  // in which case the agent removes the pool along with the vhost. Empty for a
  // static or reverse-proxied site, and empty when the account keeps other
  // sites on the same version.
  //
  // The decision is the panel's and cannot be the agent's: a php-fpm pool
  // belongs to an ACCOUNT and a version, and two sites on the same version
  // share one pool and one worker budget. Only the panel holds the rows that
  // say whether another site still needs it; the vhosts on disk are a
  // rendering of those rows, not a second copy to count.
  //
  // Added 2026-09-01.
  string retired_php_version = 3;
  // Which web server holds the site's vhost; UNSPECIFIED means nginx. Added
  // 2026-11-10 (issue #517).
  SiteWebServer web_server = 4;
}

message DeleteSiteResponse {
  oneof result {
    DeleteSiteOk ok = 1;
    AgentError error = 2;
  }
}

message DeleteSiteOk {}

// Which log stream to tail.
enum SiteLogKind {
  SITE_LOG_KIND_UNSPECIFIED = 0;
  SITE_LOG_KIND_ACCESS = 1;
  SITE_LOG_KIND_ERROR = 2;
}

message TailSiteLogRequest {
  // System username of the owning account.
  string account_username = 1;
  // Primary domain of the site whose log is read.
  string domain = 2;
  // Which log to tail.
  SiteLogKind kind = 3;
  // Number of historical lines to send before switching to live tailing.
  // Capped by the agent at 1000 regardless of the requested value.
  uint32 history_lines = 4;
}

message TailSiteLogResponse {
  oneof result {
    TailSiteLogLine ok = 1;
    AgentError error = 2;
  }
}

message TailSiteLogLine {
  // One raw log line, without trailing newline.
  string line = 1;
  // True for lines sent from the historical tail; false for lines streamed
  // live as they are appended.
  bool historical = 2;
}

message ReloadWebServerRequest {
  // Which web server to reload; UNSPECIFIED means nginx, the behaviour before
  // the site web server was a choice. Added 2026-11-10 (issue #517).
  SiteWebServer web_server = 1;
}

message ReloadWebServerResponse {
  oneof result {
    ReloadWebServerOk ok = 1;
    AgentError error = 2;
  }
}

message ReloadWebServerOk {}

// Where the next SummariseSiteTraffic call continues.
message TrafficCursor {
  // Opaque identity of the log file the offset belongs to. The panel stores it
  // and sends it back unchanged; it never interprets it.
  string file_id = 1;
  // Bytes of that file already counted (always at a line boundary).
  uint64 offset = 2;
}

message SummariseSiteTrafficRequest {
  // System username of the owning account.
  string account_username = 1;
  // Primary domain of the site whose access log is summarised.
  string domain = 2;
  // Where the previous call ended. Absent: start at the previous rotation
  // (".1") if present, then the live file.
  TrafficCursor cursor = 3;
}

message SummariseSiteTrafficResponse {
  oneof result {
    SummariseSiteTrafficOk ok = 1;
    AgentError error = 2;
  }
}

message SummariseSiteTrafficOk {
  // Deltas read since the cursor, bucketed by UTC date, oldest first. The
  // panel adds them to what it holds; they are not totals.
  repeated TrafficDay days = 1;
  // Where the next call starts. Absent when the site has no access log yet.
  TrafficCursor cursor = 2;
  // False when the 64 MiB budget stopped the read early; call again.
  bool caught_up = 3;
  // True when the file the request's cursor named is gone: the lines between
  // the cursor and what was read are lost, and the figures may be incomplete.
  bool gap = 4;
  // Lines the tokenizer refused (over 8 KiB, or not in the combined format).
  uint32 unparsed_lines = 5;
}

// One UTC day's deltas.
message TrafficDay {
  // "YYYY-MM-DD" in UTC.
  string date = 1;
  // Requests counted for the day.
  uint64 requests = 2;
  // Response body bytes sent, summed.
  uint64 body_bytes = 3;
  // Requests per status code; at most 64 distinct codes, so the sum can be
  // lower than requests.
  repeated TrafficStatus statuses = 4;
  // Most requested paths, highest first, at most 50; the query string is
  // already removed.
  repeated TrafficPath paths = 5;
  // Requests whose path is not in paths (beyond the cap, too long, or not a
  // path).
  uint64 other_path_requests = 6;
}

message TrafficStatus {
  // HTTP status code.
  uint32 code = 1;
  // Requests answered with it.
  uint64 requests = 2;
}

message TrafficPath {
  // Request path without its query string, at most 512 bytes.
  string path = 1;
  // Requests for it.
  uint64 requests = 2;
}

message PruneSiteLogsRequest {
  // System username of the owning account.
  string account_username = 1;
  // Primary domain of the site whose rotated logs are pruned.
  string domain = 2;
  // How many rotations to keep, 1 to 14. Archives numbered above it are removed.
  uint32 retain_rotations = 3;
}

message PruneSiteLogsResponse {
  oneof result {
    PruneSiteLogsOk ok = 1;
    AgentError error = 2;
  }
}

message PruneSiteLogsOk {
  // How many archive files were removed by this call.
  uint32 removed_files = 1;
}

// Which host name a site answers canonically. A non-default value makes the
// other of the apex / "www." pair redirect (permanently) to the canonical one.
enum CanonicalHost {
  // No canonical redirect: the site answers on every name it claims.
  CANONICAL_HOST_UNSPECIFIED = 0;
  // The "www." name is canonical; the apex redirects to it.
  CANONICAL_HOST_WWW = 1;
  // The apex name is canonical; the "www." name redirects to it.
  CANONICAL_HOST_APEX = 2;
}

// How a redirect rule's path is compared with the request path.
enum RedirectMatch {
  // Refused by the agent.
  REDIRECT_MATCH_UNSPECIFIED = 0;
  // The request path equals the rule's path.
  REDIRECT_MATCH_EXACT = 1;
  // The request path starts with the rule's path, which ends in "/".
  REDIRECT_MATCH_PREFIX = 2;
}

// Whether the listed networks are the only ones allowed or the ones refused.
enum IpAccessMode {
  // Only valid when the list is empty (no IP rules); refused otherwise.
  IP_ACCESS_MODE_UNSPECIFIED = 0;
  // Only the listed networks may reach the site; everyone else is refused.
  IP_ACCESS_MODE_ALLOW_LIST = 1;
  // The listed networks are refused; everyone else may reach the site.
  IP_ACCESS_MODE_DENY_LIST = 2;
}

// The per-site options the vhost is rendered with. Every value is re-validated
// by the agent against its own types; none is written into configuration
// unvalidated. All fields default to "absent".
message SiteOptions {
  // Canonical host redirect; UNSPECIFIED means none.
  CanonicalHost canonical_host = 1;
  // Largest request body nginx accepts, in MiB, 1 to 1024; 0 leaves nginx's
  // default.
  uint32 client_max_body_size_mib = 2;
  // How many days browsers may cache static files, 1 to 365; 0 sends no cache
  // headers.
  uint32 static_cache_days = 3;
  // Redirect rules, at most 25, rendered in the order given.
  repeated RedirectRule redirects = 4;
  // HTTP basic authentication in front of the whole site; absent when it has
  // no users.
  BasicAuth basic_auth = 5;
  // IP allow / deny list; absent when it has no networks.
  IpAccess ip_access = 6;
  // How many requests per second one visitor address may make to the site,
  // 1 to 1000; 0 means no limit. Rendered as an nginx `limit_req` zone keyed on
  // the connecting address, which behind a proxy or CDN is the proxy's address.
  // A request over the limit is answered 429. Added 2026-11-07 (issue #159).
  uint32 request_rate_per_second = 7;
  // How many requests above request_rate_per_second one visitor address may
  // send in a burst before being refused, 0 to 1000. Meaningful only with a
  // request_rate_per_second; a burst with no rate is refused as INVALID_INPUT
  // rather than read as "no limit". Added 2026-11-07 (issue #159).
  uint32 request_burst = 8;
}

// One redirect rule.
message RedirectRule {
  // The path the rule applies to: starts with "/", at most 255 bytes, no query
  // string. A PREFIX rule's path ends in "/".
  string path = 1;
  // How the path is compared.
  RedirectMatch match = 2;
  // Where to send the request: an absolute http(s) URL or a path on this site.
  string target = 3;
  // HTTP status of the redirect: 301 or 302. Any other value is refused.
  uint32 status = 4;
}

// HTTP basic authentication.
message BasicAuth {
  // Users allowed in, at most 10.
  repeated BasicAuthUser users = 1;
}

// One basic-authentication user. The agent never sees a password.
message BasicAuthUser {
  // The login name: 1 to 32 characters of [A-Za-z0-9._-].
  string name = 1;
  // The bcrypt hash ("$2y$", "$2a$" or "$2b$", cost 10 to 14), computed by the
  // panel. Secret: never logged, never echoed back in any response.
  string password_hash = 2;
}

// The IP rules of a site.
message IpAccess {
  // Whether the list allows or refuses.
  IpAccessMode mode = 1;
  // Addresses or CIDR ranges ("203.0.113.0/24", "2001:db8::/32"), at most 25.
  repeated string cidrs = 2;
}
