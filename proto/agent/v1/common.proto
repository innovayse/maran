// Shared contract types for the Maran API <-> agent boundary.
// Evolution rules: rules/proto.md (additive only inside v1).
syntax = "proto3";

package maran.agent.v1;

// Pins the generated C# namespace to Maran's PascalCase convention
// (protoc's default title-casing would otherwise yield "Maran...").
// Codegen-only: does not affect the wire format or the Rust side.
option csharp_namespace = "Maran.Agent.V1";

// Typed failure of an agent operation. `code` drives API behavior; `message`
// is operator-facing English and is never shown raw to hosting customers.
message AgentError {
  // Machine-readable category of the failure.
  ErrorCode code = 1;
  // Operator-facing description (English, no secrets, no customer data).
  string message = 2;
  // Excerpt of the failing tool's output (e.g. `nginx -t` stderr), max 4 KiB.
  string tool_output = 3;
}

// Failure categories every operation maps into.
enum ErrorCode {
  // Never sent deliberately: proto3 requires a zero value, and receiving it
  // means the agent failed without classifying the failure.
  ERROR_CODE_UNSPECIFIED = 0;
  // Input failed the agent's own validation (regex/path containment).
  ERROR_CODE_INVALID_INPUT = 1;
  // Idempotency outcome: the requested entity already exists.
  ERROR_CODE_ALREADY_EXISTS = 2;
  // Idempotency outcome: the requested entity does not exist.
  ERROR_CODE_NOT_FOUND = 3;
  // A rendered config failed its validator; previous state was restored.
  ERROR_CODE_VALIDATION_FAILED = 4;
  // Unexpected system failure (tool crashed, IO error); see tool_output.
  ERROR_CODE_SYSTEM_FAILURE = 5;
  // Added 2026-08-31, additively. A server-streaming rpc the AGENT ended
  // because the client stopped reading it: the send buffer stayed full past
  // the agent's patience, so the stream was dropped to free the worker behind
  // it. Not a fault of the operation, and retryable immediately by reopening
  // the stream. Also answers a client-streaming rpc (WriteFile, ImportBackup)
  // whose client went silent past the agent's per-message idle limit: the
  // upload was abandoned, nothing was published, and the account is free.
  ERROR_CODE_STREAM_DROPPED = 6;
  // Added 2026-08-31, additively. A server-streaming rpc the agent closed
  // because nothing happened on it for the agent's maximum idle time. Benign
  // and expected — a log nobody wrote to, not a failure — and given its own
  // code so a panel can say "nothing more was logged" instead of raising a
  // fault. Reopen the stream to keep watching.
  ERROR_CODE_STREAM_IDLE = 7;
  // Added 2026-09-06, additively. The request is well formed and the agent
  // understands it, but this build holds no code path that could carry it
  // out. It exists for one case, documented at that case rather than in the
  // abstract: BackupDestination can name an S3 bucket, while the agent's
  // backup operations reach only a directory on this machine, so a remote
  // destination is refused with this code instead of being taken quietly down
  // the local path. Not retryable against the same agent — a panel that reads
  // it tells the operator, rather than backing off and asking again.
  ERROR_CODE_NOT_IMPLEMENTED = 8;
  // Added 2026-09-12, additively. Another operation for the SAME hosting
  // account is already running, and this one was refused so the two could not
  // interleave. The agent holds one wait-free lock per account and takes it at
  // the entry of every operation that makes or unmakes the account's identity
  // on this host — account deletion, the SFTP and FTPS login operations, the
  // suspension of an account's logins, the php-fpm pool write, and the four
  // backup operations. A second operation does not queue behind the first: an
  // RPC held open for the length of a twenty-gigabyte backup is measured in
  // hours, so the refusal is deliberate and immediate.
  //
  // **Nothing happened.** The refusal is the first statement of the operation,
  // before any tool runs and before any file is touched, so the account is
  // exactly as the caller found it. That is what makes this code safe to
  // retry: a panel reads it as "another operation on this account is running,
  // try again in a moment" and may reissue the identical request once the
  // first operation finishes.
  //
  // What it does NOT license: retrying a call that TIMED OUT or was cancelled.
  // A cancelled call detaches the agent's blocking work rather than cancelling
  // it, so a second attempt would run BESIDE the first rather than after it.
  // Only this code says nothing ran; a deadline that expired says nothing
  // about what the agent is still doing.
  //
  // It is narrower than "something went wrong, try later" on purpose, and a
  // caller MUST NOT widen it: it means one thing — this account's lock was
  // held. It is not the code for a busy host, a tool that was itself busy, a
  // rate limit, or any other retryable fault. The agent's four other locks
  // WAIT rather than refuse, so none of them can produce it.
  ERROR_CODE_ACCOUNT_BUSY = 9;
  // Added 2026-09-13, additively. The request stated a countable allowance for
  // the account and the account has already reached it, so the operation was
  // refused. The allowance is the PANEL's number: the agent holds no plan and
  // invents no limit, it only compares the number the request carried against
  // what it counted under the lock it already holds for that account.
  //
  // It exists because one countable limit in this product cannot be made
  // atomic in the panel. Every other one is closed by counting rows and
  // inserting inside one transaction; cron keeps no rows at all, so the only
  // place where the count and the write are one indivisible act is inside the
  // agent's per-account cron lock. The panel therefore states the allowance and
  // the agent enforces it there. See `CreateCronEntryRequest.max_entries`.
  //
  // **Nothing happened.** Like ERROR_CODE_ACCOUNT_BUSY the refusal is decided
  // before anything is written, so the account is exactly as the caller found
  // it. Unlike it, this is NOT retryable: the answer will be the same until the
  // account holds fewer entries or the operator raises the allowance. A panel
  // that reads it tells the operator which of those two to do; a panel that
  // retried it would loop.
  //
  // A request that states no allowance can never produce this code, which is
  // what keeps the field additive: an older panel that says nothing about a
  // limit gets exactly the behaviour it had before this code existed.
  //
  // It is NOT the code for a busy account, a full disk, or a quota the host
  // itself enforces. A caller MUST NOT widen it, and in particular MUST NOT
  // reach for ERROR_CODE_ACCOUNT_BUSY instead: that code means the lock was
  // held and says nothing about a limit, and a panel reading it retries.
  ERROR_CODE_LIMIT_REACHED = 10;
  // Added 2026-10-31, additively (issue #251). A package install failed
  // because a package SOURCE answered and refused: a repository mirror or its
  // mirror list replied with an HTTP error (404, 403, 5xx) for the metadata
  // or the archive the package manager asked for. The fault is outside this
  // host — the request was sound and the host's package manager did its part —
  // so a panel answers it as an upstream refusal and not as a local fault.
  //
  // Only the agent's package classification produces it, from the package
  // manager's exit status AND its own output, and only when that output names
  // a refused fetch. Retrying immediately usually meets the same mirror; the
  // operator's remedy is the mirror, not this server.
  //
  // It is NOT the code for a package the configured repositories do not
  // carry, a held package database lock or a failing maintainer script: those
  // are this host's state and stay ERROR_CODE_SYSTEM_FAILURE.
  ERROR_CODE_PACKAGE_SOURCE_REFUSED = 11;
  // Added 2026-10-31, additively (issue #251). A package install failed
  // because no package source could be reached at all: the mirror's name did
  // not resolve, the connection was refused or timed out, or the network was
  // unreachable. Distinct from ERROR_CODE_PACKAGE_SOURCE_REFUSED because the
  // remedy differs — nothing answered, so this is a transient unavailability a
  // later attempt may clear, not a mirror that said no.
  //
  // When one install meets both — one fetch refused and another unreachable —
  // the agent reports ERROR_CODE_PACKAGE_SOURCE_REFUSED: a source that answered
  // with a refusal is the more specific observation.
  ERROR_CODE_PACKAGE_SOURCE_UNREACHABLE = 12;
  // Added 2026-11-01, additively (issue #148). The operation would write into
  // a filesystem that has less than the agent's free-space floor available to
  // an unprivileged writer (`f_bavail`), so it was refused. The floor is the
  // agent's own `--free-space-floor-mib`, written by the installer; no request
  // carries it. HostMetrics.free_space_floor_bytes reports it.
  //
  // Four operations ask: CreateAccount and WriteFile (the filesystem holding
  // the account homes), CreateBackup (the account's backup directory) and
  // RestoreBackup (the account homes again, before anything is extracted).
  //
  // **Nothing happened.** The check is made before the operation's first
  // write, so the host is exactly as the caller found it. It is NOT retryable
  // as it stands: the answer is the same until space is freed or the floor is
  // lowered, and a panel tells the operator so rather than retrying.
  //
  // A filesystem the agent could not measure is not this code: it is
  // ERROR_CODE_SYSTEM_FAILURE, because the host is at fault and not the
  // disk's fill. It is also NOT the code for an account over its own quota,
  // which the filesystem enforces by itself.
  ERROR_CODE_BELOW_FREE_SPACE_FLOOR = 13;
  // Added 2026-11-01, additively (issue #158). The operation was refused
  // because the ACCOUNT is suspended, and performing it would act on the
  // account's behalf while the panel has stopped it doing so. Today only
  // RunCronEntry asks: a suspended entry is invisible to cron, and starting it
  // by hand would be a way around the suspension.
  //
  // **Nothing happened.** The refusal is decided before any program starts, so
  // the account is exactly as the caller found it. It is NOT retryable as it
  // stands: the answer is the same until the account is resumed.
  //
  // It is NOT the code for an entry the customer disabled themselves — that is
  // the customer's own switch and does not refuse a run they asked for — and it
  // is not ERROR_CODE_ACCOUNT_BUSY, which means a lock was held and invites a
  // retry.
  ERROR_CODE_ACCOUNT_SUSPENDED = 14;
  // Added 2026-11-03, additively (issues #333 and #331). The operation was
  // refused because a bounded resource of the AGENT itself is exhausted, and
  // admitting one more would take capacity from every other tenant. RunCronEntry
  // asks (and, since 2026-11-07, the browse rpcs, see below): a run by hand holds a worker thread of the agent for up
  // to its runtime ceiling, so the agent admits a fixed number of them at once
  // for the whole host and a smaller number for one account (the numbers are
  // the agent's, not the panel's, and are not on the wire).
  //
  // **Nothing happened.** The refusal is decided before the account's crontab
  // is read and before any program starts, so the account is exactly as the
  // caller found it. It IS retryable, later: the answer changes as soon as a
  // running call finishes, which is at most the runtime ceiling away. A panel
  // that reads it tells the customer to wait and try again, and does not retry
  // in a loop.
  //
  // It is NOT ERROR_CODE_ACCOUNT_BUSY, which means one account's lock was held
  // by a different operation and is cleared by that operation ending; nor
  // ERROR_CODE_LIMIT_REACHED, which is the panel's own allowance for the
  // account and does not clear by waiting; nor SYSTEM_FAILURE, because nothing
  // is wrong with the host. A caller MUST NOT widen it to "the agent is busy
  // for any reason".
  //
  // Widened 2026-11-07 by exactly one more use (issue #166): ListDirectory,
  // ReadFile and SearchEntries also answer it when the agent's fixed bound on
  // simultaneous browse operations (per account and for the whole host) is
  // reached. The meaning is unchanged: a bounded resource of the agent is
  // exhausted, nothing happened, retry later.
  ERROR_CODE_AGENT_SATURATED = 15;
  // Added 2026-11-03, additively (issues #336 and #331). The operation STARTED
  // a unit of work in the service manager, a ceiling (the output cap or the
  // deadline) ended the run, and the agent then could not confirm that the unit
  // was stopped. Today only RunCronEntry returns it.
  //
  // **The opposite of "nothing happened".** The customer's job may STILL BE
  // RUNNING, and it will keep running until the service manager's own runtime
  // ceiling stops it. A caller MUST NOT report it as a run that was stopped, and
  // MUST NOT say that nothing was altered. It is NOT retryable as it stands: a
  // second call would start a second run beside the first.
  //
  // It is NOT ERROR_CODE_SYSTEM_FAILURE, which this outcome used to ride on and
  // whose generic reading is "the request failed and the host is as it was";
  // and not ERROR_CODE_AGENT_SATURATED, where nothing was started at all. A
  // caller MUST NOT widen it to "a stop failed for any reason".
  ERROR_CODE_RUN_NOT_STOPPED = 16;
  // Added 2026-11-07, additively (issue #166). A read-only file operation was
  // refused because what it was asked to hand back is larger than the agent
  // will carry: a file larger than the request's max_bytes (or that grew past
  // it while being read), or a directory holding more entries than a listing
  // can describe. Today only ListDirectory and ReadFile return it.
  //
  // **Nothing was changed**, and for ReadFile nothing was sent before the
  // refusal unless a file grew mid-read, in which case the caller MUST discard
  // the partial body. It is NOT retryable as it stands: the same request meets
  // the same size. A panel that reads it tells the customer the file or
  // directory is too large to open here.
  //
  // It is NOT ERROR_CODE_INVALID_INPUT, which refuses a request as sent without
  // looking at the filesystem, nor ERROR_CODE_VALIDATION_FAILED, which is the
  // answer for a path containment refused. A caller MUST NOT widen it to "the
  // answer would be big" for an operation that can truncate instead (a search
  // reports truncated and is never this code).
  ERROR_CODE_TOO_LARGE = 17;
  // Added 2026-11-07, additively (issue #167). A write was refused because the
  // account's disk quota is used up: the kernel answered EDQUOT. Returned by
  // the file operations that write on the account's behalf (WriteFile,
  // CopyEntry, CreateDirectory and, in time, ExtractArchive and CreateArchive).
  //
  // **Nothing is left behind**: the temporary file or staged copy the call was
  // making is removed before this answer. It is NOT retryable as it stands: the
  // same request meets the same quota, and a panel that reads it tells the
  // customer to free space or ask for a bigger plan.
  //
  // It is NOT ERROR_CODE_BELOW_FREE_SPACE_FLOOR, which is the HOST running out
  // of room for everyone and is the operator's problem; it is NOT
  // ERROR_CODE_LIMIT_REACHED, which is an allowance a request stated; and
  // ENOSPC (the filesystem itself full) stays ERROR_CODE_SYSTEM_FAILURE. A
  // caller MUST NOT widen it to "the disk is full".
  ERROR_CODE_QUOTA_EXCEEDED = 18;
  // Added 2026-11-07, additively (issue #167, for #168). An archive was
  // refused as a whole, before anything was written, because it holds a member
  // the agent will not write: a link, a device, FIFO or socket, a name that
  // could leave the destination (absolute, "..", an empty component, a
  // backslash or a control character), a duplicate name, an encrypted member,
  // or a compression method other than stored or deflate. Today no rpc returns
  // it; ExtractArchive and CreateArchive will, when the agent implements them.
  //
  // **Nothing was changed.** It is NOT retryable as it stands: the same archive
  // holds the same member. A panel that reads it tells the customer the archive
  // is not safe to unpack here, without naming the member (the member's name is
  // the customer's own data and the panel's journal, not this answer, carries
  // it).
  //
  // It is NOT ERROR_CODE_VALIDATION_FAILED, which is a path or an archive of
  // the wrong kind (a zip presented as a tar.gz, a corrupt archive); it is NOT
  // ERROR_CODE_LIMIT_REACHED, which is a stated count or size reached. A caller
  // MUST NOT widen it to "the archive is bad".
  ERROR_CODE_ARCHIVE_UNSAFE = 19;
  // Added 2026-11-07, additively (issue #445). A sealed (encrypted) backup
  // archive did not open under the key the call carried, or the call carried
  // no key for an archive that is sealed. Returned by RestoreBackup and
  // VerifyBackup (and any other rpc that opens a sealed artifact) before
  // anything was extracted or loaded.
  //
  // **Nothing was changed.** The panel's reading is "this destination's
  // archive key is wrong, lost, or never sent", and that is the likeliest
  // cause but not a proven one: the cipher authenticates every chunk, so a
  // wrong key and a damaged or tampered sealed file fail identically and the
  // agent cannot say which it was. The name states what is known (the archive
  // cannot be opened with this key) and not what is guessed.
  //
  // It is NOT ERROR_CODE_VALIDATION_FAILED, which is a plain artifact that
  // disagrees with its record (checksum, size, manifest) and which a restore
  // answers with "restore from another copy"; the remedy here is different
  // (check the destination's key). It is NOT ERROR_CODE_INVALID_INPUT, which
  // is a request the agent will not act on. A caller reading an old agent that
  // lacks this value sees the earlier codes for the same failures
  // (VALIDATION_FAILED for a wrong key, INVALID_INPUT for a missing one).
  ERROR_CODE_ARCHIVE_UNOPENABLE = 20;
}

// Streamed progress of a long-running operation (backup, restore, install).
message Progress {
  // 0..100; monotonically non-decreasing per stream.
  uint32 percent = 1;
  // Short machine-stable stage id (e.g. "dumping_db"), i18n happens API-side.
  string stage = 2;
}

// Which file-transfer daemon serves a login.
//
// Added 2026-09-09 with FTPS. Deliberately NOT called `Protocol`:
// `firewall.proto` already declares a top-level `Protocol` in this package —
// enums are package-scoped in proto3, so a second one of that name is a protoc
// refusal rather than a shadowing.
//
// It lives here rather than in `ftp.proto` because `accounts.proto` reads it
// too: a suspension attestation names the daemon behind every login it saw, and
// an attestation importing the login service's file to learn a two-value enum
// would tie the account contract to the transfer contract for no reason.
enum TransferProtocol {
  // The agent did not say. An old agent predating this enum sends this, and a
  // caller MUST then read the login as SFTP: before FTPS existed every login a
  // suspension could report was an SFTP login by construction, so that is the
  // correct reading and not a guess.
  TRANSFER_PROTOCOL_UNSPECIFIED = 0;
  // Served by the host's OpenSSH daemon, jailed under /var/lib/maran-sftp.
  TRANSFER_PROTOCOL_SFTP = 1;
  // Served by this panel's own vsftpd instance, jailed under
  // /var/lib/maran-ftps.
  TRANSFER_PROTOCOL_FTPS = 2;
}
